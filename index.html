<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>স্মার্ট এডুকেশন সিস্টেম</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#1d2433;--mu:#6b7385;--pri:#3b5bdb;--gr:#16a34a;--rd:#e11d48;--pu:#7c3aed;--ln:#e3e7f0}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2c;--tx:#e8ecf5;--mu:#98a0b3;--ln:#2a3144}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0 8px;font:inherit;font-size:12px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pri);font-weight:700}
.hero{background:linear-gradient(135deg,#3b5bdb,#4c6ef5);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.hero h1{font-size:19px}.hero p{font-size:13px;opacity:.85;margin-top:4px}
.hero .clk{font-size:26px;font-weight:700;margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{border-radius:14px;padding:14px;color:#fff}.st small{opacity:.9;font-size:13px}.st div{font-size:28px;font-weight:700;margin-top:4px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--ln)}
.card h2{font-size:16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row .f{flex:1;min-width:0}.row small{color:var(--mu);display:block;font-size:12px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;background:var(--pri);color:#fff}
.btn.s{padding:6px 10px;font-size:12px}.btn.g{background:var(--gr)}.btn.r{background:var(--rd)}.btn.o{background:none;color:var(--pri);border:1px solid var(--pri)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);margin-bottom:8px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}.top input,.top select{margin:0}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#e8edff;color:var(--pri)}
.tag.g{background:#dcfce7;color:var(--gr)}.tag.r{background:#ffe4e9;color:var(--rd)}
.mt{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}
.mt>div{background:var(--card);width:100%;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.em{text-align:center;color:var(--mu);padding:24px 0;font-size:14px}
.pb{width:44px;height:36px;border-radius:10px;border:1px solid var(--ln);background:none;font:inherit;color:var(--mu)}
.pb.p{background:var(--gr);color:#fff;border-color:var(--gr)}.pb.a{background:var(--rd);color:#fff;border-color:var(--rd)}
.lb{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}.hint{font-size:12px;color:var(--mu);margin:-2px 0 6px}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:8px}.tabs div{padding:8px 14px;font-size:14px;color:var(--mu)}.tabs .on{color:var(--pri);border-bottom:2px solid var(--pri);font-weight:700}
.ch{display:flex;gap:8px;margin-bottom:4px}.ch button{flex:1;height:40px;border-radius:10px;border:1px solid var(--ln);background:none;font:inherit;font-size:14px;color:var(--tx)}.ch button.on{border-color:var(--pri);background:#e8edff;color:var(--pri)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#e8edff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.seg{display:flex;background:var(--ln);border-radius:12px;padding:4px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font:inherit;font-size:14px;color:var(--mu)}.seg button.on{background:var(--card);color:var(--tx);font-weight:700}
.sub{display:flex;gap:2px;overflow-x:auto;margin-bottom:10px;border-bottom:1px solid var(--ln)}.sub button{white-space:nowrap;border:0;background:none;padding:9px 10px;font:inherit;font-size:13px;color:var(--mu)}.sub button.on{color:var(--pri);border-bottom:2px solid var(--pri);font-weight:700}
.chip{border:0;border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;background:var(--ln);color:var(--tx)}.chip.on{background:var(--pri);color:#fff}
.tgb{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;background:var(--ln);color:var(--tx)}.tgb.on{background:#f97316;color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sc{border-radius:14px;padding:12px;display:flex;align-items:center;gap:8px}.sc i{width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;flex:none}.sc b{font-size:22px;display:block;line-height:1.1}.sc small{font-size:12px;color:#444}
.ar{padding:10px 0;border-bottom:1px solid var(--ln)}.ah{display:flex;align-items:center;gap:10px}.ai{width:22px;color:var(--mu);font-size:13px}
.ab{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ab button{border:1px solid var(--ln);background:none;border-radius:20px;padding:6px 12px;font:inherit;font-size:12px;color:var(--mu)}.ab button.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);font-weight:700}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{text-align:left;color:var(--mu);font-weight:600;padding:8px 6px;background:var(--bg);white-space:nowrap}.tb td{padding:9px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}.ov{overflow-x:auto}
.hero{position:relative}.hero .lg{width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex:none}.hero .lg img{width:100%;height:100%;object-fit:cover}
.hero small{display:block;font-size:11px;opacity:.85;line-height:1.5}.tick{background:#fff;color:#444;border-radius:12px;padding:8px 10px;margin-top:12px;font-size:13px;display:flex;gap:8px;align-items:center}.live{background:#fee2e2;color:#e11d48;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;flex:none}
.st{position:relative;overflow:hidden;border-radius:16px}.st:after{content:"";position:absolute;right:-20px;top:-20px;width:84px;height:84px;border-radius:50%;background:#ffffff26}.st .ic{position:absolute;right:12px;top:14px;width:34px;height:34px;border-radius:10px;background:#ffffff33;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:1}
.bd{position:absolute;top:-6px;right:-9px;background:#e11d48;color:#fff;border-radius:10px;font-size:10px;padding:0 5px;font-weight:600}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ch h2{margin:0}.lk{color:var(--pri);font-size:13px}
.mini{border-radius:12px;padding:10px 6px;text-align:center;font-size:12px}.mini b{display:block;font-size:14px;margin:4px 0}
.lg2{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}.lg2 i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.ac{border-radius:16px;padding:14px;color:#fff;position:relative;overflow:hidden}.ac b{display:block;font-size:22px;margin:4px 0}.ac small{opacity:.9;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin:10px 0}.bars div{flex:1;border-radius:10px 10px 0 0;color:#fff;text-align:center;font-size:12px;padding-top:6px}
.cb{appearance:none;-webkit-appearance:none;width:22px;height:28px;border:1.5px solid var(--pri);border-radius:8px;background:none;flex:none;margin:2px 0 0;padding:0;position:relative}.cb:checked{background:var(--pri)}.cb:checked:after{content:"✓";color:#fff;position:absolute;left:4px;top:3px;font-size:14px}
.sc2{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px 10px 12px;margin-bottom:10px}
.pl{display:inline-block;font-size:11px;padding:2px 9px;border-radius:6px;background:var(--ln);color:var(--mu);margin:0 4px 4px 0}.pl.g{background:#dcfce7;color:#16a34a}.pl.b{background:#dbe4ff;color:#3b5bdb}.pl.r{background:#ffe4e9;color:#e11d48}
.dots{border:0;background:none;font-size:22px;color:var(--mu);line-height:1;padding:0 6px}
.ob{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;font-size:13px}.ob.g{border-color:#16a34a;color:#16a34a;background:#f0fdf4}
.mr{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:14px}.mr i{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-style:normal;flex:none}.mr.rd{color:var(--rd)}.mr.rd i{background:#ffe4e9}
.tb.wr th,.tb.wr td{white-space:normal;font-size:11px;padding:8px 3px;vertical-align:middle}.tb.wr .pl{font-size:10px;padding:1px 6px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .wd{text-align:center;font-size:11px;color:var(--mu);padding:4px 0}.cd{border:1px solid var(--ln);border-radius:8px;min-height:46px;padding:3px;font-size:12px;text-align:center;background:var(--card)}.cd i{display:inline-block;width:6px;height:6px;border-radius:50%;margin:1px}.cd.sel{border-color:#f97316;background:#fff7ed;color:#222}.cd.td span{background:#f97316;color:#fff;border-radius:10px;padding:0 5px}
.hb{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}.hb .ic2{width:46px;height:46px;border-radius:12px;background:#e8edff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.rtt th{background:#2563eb!important;color:#fff!important}
.hb small{display:block;margin-top:2px}.hb .pl{white-space:nowrap;margin:0}
</style>
</head>
<body>
<div id="app"><main id="v"></main>
<nav id="nv"></nav></div>
<script>
const KEY="smart-edu-v1";
const D=()=>({school:{name:"আল-উম্মাহ মডেল মাদ্রাসা",addr:"স্টেশন বাজার, নেত্রকোনা"},students:[],teachers:[],att:{},fees:[],notices:[],exams:[],txns:[],books:[],hw:[],staff:[],log:[],smslog:[],routine:[],events:[],tbooks:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||D()}catch(e){S=D()}S={...D(),...S};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"৳"+bn(Number(n||0).toLocaleString("en-US"));
const $=id=>document.getElementById(id);
let tab="home",q="",cls="",adate=today();
const TABS=[["home","🏠","হোম"],["att","✅","উপস্থিতি"],["stu","👥","শিক্ষার্থী"],["fee","👛","ফি"],["more","☰","আরও"]];
const stuName=id=>(S.students.find(s=>s.id==id)||{}).name||"—";
const due=f=>f.amt-f.paid;

function render(){
 $("nv").innerHTML=TABS.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
 $("v").innerHTML=({home,att,stu,fee,more})[tab]();
}
function go(t){tab=t;q="";sub="";curExam="";profId="";render();$("v").scrollTop=0}

let homeCls="",logAll=false,photoCb=null,photoDoc=false;
const p2=n=>String(n).padStart(2,"0");
function logA(ty,cat,tx){S.log.unshift({t:Date.now(),ty,cat,tx});S.log=S.log.slice(0,60)}
function autoFees(){const d=new Date(),ym=mk(d.getFullYear(),d.getMonth());S.students.forEach(s=>{if(s.status=="নিষ্ক্রিয়"||!(+s.monthlyFee>0))return;if(!S.fees.some(f=>f.sid==s.id&&f.auto==ym))S.fees.push({id:uid(),sid:s.id,title:"মাসিক বেতন — "+MN[d.getMonth()]+" "+bn(d.getFullYear()),amt:+s.monthlyFee,paid:0,date:today(),auto:ym})})}
function bnDate(d){const Y=d.getFullYear(),st=new Date(d<new Date(Y,3,14)?Y-1:Y,3,14),sy=st.getFullYear(),n=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-st)/864e5),lp=(y=>y%4==0&&(y%100!=0||y%400==0))(sy+1),L=[31,31,31,31,31,30,30,30,30,30,lp?30:29,30],M=["বৈশাখ","জ্যৈষ্ঠ","আষাঢ়","শ্রাবণ","ভাদ্র","আশ্বিন","কার্তিক","অগ্রহায়ণ","পৌষ","মাঘ","ফাল্গুন","চৈত্র"];let m=0,r=n;while(m<11&&r>=L[m]){r-=L[m];m++}return bn(r+1)+" "+M[m]+", "+bn(sy-593)+" বাংলা"}
function hijri(d){try{return new Intl.DateTimeFormat("bn-BD-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).formatToParts(d).filter(x=>x.type!="era").map(x=>x.value).join("").trim()+" হিজরী"}catch(e){return ""}}
function donut(segs,z,sw,t1,t2,c1){const r=(z-sw)/2,C=2*Math.PI*r,tot=segs.reduce((a,x)=>a+x.v,0);let off=0,cs="";
 if(!tot)cs=`<circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="#e3e7f0" stroke-width="${sw}"/>`;
 else segs.forEach(x=>{if(x.v>0){const l=C*x.v/tot;cs+=`<circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="${x.c}" stroke-width="${sw}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 ${z/2} ${z/2})"/>`;off+=l}});
 return `<svg viewBox="0 0 ${z} ${z}" width="${z}" height="${z}" style="display:block;margin:4px auto">${cs}<text x="50%" y="${t2?"50%":"56%"}" text-anchor="middle" font-size="${t2?17:22}" font-weight="700" fill="${c1||"currentColor"}">${t1}</text>${t2?`<text x="50%" y="63%" text-anchor="middle" font-size="9" fill="#6b7385">${t2}</text>`:""}</svg>`}
function nav(t,sb){closeM();tab=t;sub=sb||"";curExam="";q="";profId="";render();$("v").scrollTop=0}
function drawer(){modal(`<h2 style="margin-bottom:6px">${esc(S.school.name)}</h2>`+[["home","","🏠","ড্যাশবোর্ড"],["stu","","👥","শিক্ষার্থী"],["att","","✅","উপস্থিতি"],["fee","","👛","ফি"]].concat(MENU.map(m=>["more",m[0],m[1],m[2]])).map(x=>`<div class="row" onclick="nav('${x[0]}','${x[1]}')"><span style="font-size:20px">${x[2]}</span><div class="f">${x[3]}</div></div>`).join(""))}
function pickLogo(){photoCb=u=>{S.school.logo=u;save();render()};pickPhoto()}
function saveSchool(){const g=i=>$(i).value.trim();S.school={...S.school,name:g("sn"),addr:g("sa"),est:g("se"),year:g("sy"),director:g("sd"),phone:g("sp")};save();alert("সংরক্ষিত হয়েছে")}

function home(){
 const T=today(),day=S.att[T]||{},ids=S.students.map(s=>s.id),pr=ids.filter(i=>day[i]=="p").length,ab=ids.filter(i=>day[i]=="a").length;
 const sc=S.school,d=new Date(),ym=mk(d.getFullYear(),d.getMonth());
 const tex=S.exams.filter(e=>e.date==T),upc=S.exams.filter(e=>e.date>T).sort((a,b)=>a.date>b.date?1:-1);
 const hw=S.hw.filter(h=>h.date==T&&(!homeCls||h.cls==homeCls));
 const stuDue=sid=>S.fees.filter(f=>f.sid==sid).reduce((a,f)=>a+due(f),0);
 const TY=[["অনাবাসিক","#3b82f6","#eff6ff","🏫"],["আবাসিক","#16a34a","#f0fdf4","🏠"],["ডেকেয়ার","#8b5cf6","#faf5ff","☺"]];
 const ty=TY.map(t=>{const ss=S.students.filter(x=>(x.type||"অনাবাসিক")==t[0]),dd=ss.map(x=>stuDue(x.id));return {t,n:ss.length,k:dd.filter(x=>x>0).length,a:dd.reduce((x,y)=>x+y,0)}});
 const totDue=S.fees.reduce((a,f)=>a+due(f),0),nDue=S.fees.filter(f=>due(f)>0).length;
 const fp=S.fees.filter(f=>f.amt>0&&f.paid>=f.amt),fd=S.fees.filter(f=>f.paid==0&&f.amt>0),fa=S.fees.filter(f=>f.paid>0&&f.paid<f.amt),sum=(l,fn)=>l.reduce((a,f)=>a+fn(f),0);
 const books=S.books.map(b=>({b,av:b.copies-b.issues.filter(i=>!i.ret).length})),copies=sum(S.books,b=>b.copies),iss=sum(S.books,b=>b.issues.filter(i=>!i.ret).length),stockOut=books.filter(x=>x.av<=0).length;
 const recs=S.fees.filter(f=>f.auto==ym),pend=recs.filter(f=>due(f)>0),mcount=S.students.filter(x=>+x.monthlyFee>0&&x.status!="নিষ্ক্রিয়").length;
 const pd=sum(S.fees,f=>f.paid),oi=sum(S.txns.filter(t=>t.type=="in"),t=>t.amt),eo=sum(S.txns.filter(t=>t.type=="out"),t=>t.amt),net=pd+oi-eo;
 const done=S.exams.filter(e=>Object.keys(e.marks).length).length,bars=[["মোট",S.exams.length,"#10b981"],["আজ",tex.length,"#f59e0b"],["আসন্ন",upc.length,"#3b82f6"],["ফলাফল",done,"#8b5cf6"]],mx=Math.max(1,...bars.map(b=>b[1]));
 const lg=S.log.slice(0,logAll?30:6),nt=S.notices.slice().reverse();
 const fl=(c,l,n,a)=>`<div class="lg2"><span><i style="background:${c}"></i>${l}</span><b style="${c=="#ef4444"?"color:var(--rd)":""}">${bn(n)} — ${money(a)}</b></div>`;
 return `<div class="top" style="justify-content:space-between;font-size:22px"><div style="display:flex;gap:18px"><span onclick="drawer()">☰</span><span style="position:relative" onclick="nav('more','notice')">🔔${nt.length?`<b class="bd">${bn(nt.length)}</b>`:""}</span></div></div>
 <div class="hero"><div style="display:flex;gap:12px"><div class="lg">${sc.logo?`<img src="${sc.logo}">`:"🕌"}</div><div style="min-width:0"><h1>${esc(sc.name)}</h1><small>📍 ${esc(sc.addr)}</small>${sc.est||sc.year?`<small>${sc.est?"স্থাপিত: "+esc(sc.est)+" ":""}${sc.year?" শিক্ষাবর্ষ: "+esc(sc.year):""}</small>`:""}${sc.director?`<small>পরিচালক: ${esc(sc.director)}</small>`:""}${sc.phone?`<small>ফোন: ${esc(sc.phone)}</small>`:""}</div></div>

}

 const bd=pc>=90?["চমৎকার","#dcfce7","#16a34a"]:pc>=75?["ভালো","#dbe4ff","#3b5bdb"]:pc>=60?["সতর্কতা","#fef3c7","#b45309"]:["উদ্বেগজনক","#ffe4e9","#e11d48"];
 const tl=(i,l,n,col)=>`<div class="mini" style="background:var(--bg)"><div style="color:${col}">${i}</div><b style="font-size:20px;color:${col}">${bn(n)}</b>${l}</div>`;
 modal(HND+`<h2 style="font-size:16px;margin-bottom:8px">📅 মাসিক উপস্থিতি রিপোর্ট</h2><div class="g2" style="margin-bottom:8px"><select onchange="arS.m=+this.value;stuAtt('${id}',1)" style="margin:0">${MN.map((m,i)=>`<option value="${i}" ${arS.m==i?"selected":""}>${m}</option>`).join("")}</select><select onchange="arS.y=+this.value;stuAtt('${id}',1)" style="margin:0">${[Y-1,Y,Y+1].map(y=>`<option value="${y}" ${arS.y==y?"selected":""}>${bn(y)}</option>`).join("")}</select></div>
 <input value="${esc(arS.sn)}" oninput="arS.sn=this.value" placeholder="প্রতিষ্ঠানের নাম">
 <div class="card" style="background:#eef2ff;display:flex;justify-content:space-between;align-items:center;padding:12px"><div><b style="color:#3b5bdb">${esc(x.name)}</b><small style="color:#6b7385">${esc(x.cls)} | শাখা: ${esc(x.branch||"—")} | রোল: ${esc(x.roll)}</small></div><span class="pl" style="background:${bd[1]};color:${bd[2]};margin:0">${bd[0]}</span></div>
 <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px">${tl("✓","উপস্থিত",c.p,"#16a34a")}${tl("✕","অনুপস্থিত",c.a,"#e11d48")}${tl("◔","বিলম্বে",c.l,"#f59e0b")}${tl("📅","ছুটি",c.h,"#3b5bdb")}</div>
 <div style="display:flex;justify-content:space-between;font-size:13px"><span>উপস্থিতির হার</span><b style="color:${bd[2]}">${bn(pc)}%</b></div><div style="height:8px;border-radius:4px;background:var(--ln);margin:6px 0"><div style="width:${pc}%;height:100%;border-radius:4px;background:${bd[2]}"></div></div><small style="color:var(--mu)">মোট ${bn(tot)} কার্যদিবস</small>
 ${tot?"":'<div class="em">এই মাসে কোনো উপস্থিতি রেকর্ড নেই।</div>'}
 <div class="g2" style="margin:12px 0 0"><button class="btn" onclick="attPdf('${id}',arS.m,arS.y,arS.sn)">PDF ডাউনলোড / প্রিন্ট</button><button class="btn o g" style="margin:0" onclick="sendTo(sOf('${id}'),'wa',attText('${id}'))">WhatsApp শেয়ার</button></div>`);
}

/* ---- transactions ---- */
function txnBody(id,rf){
 const x=sOf(id),fs=S.fees.filter(f=>f.sid==id),mo=f=>f.auto||(f.date||"").slice(0,7),Y=new Date().getFullYear(),sm=(l,k)=>l.reduce((a,f)=>a+f[k],0);
 const yr=fs.filter(f=>mo(f).startsWith(txY+"-")),P=sm(yr,"paid"),D=sm(yr,"amt")-P;
 const st=(a,p)=>a-p<=0?pill("পরিশোধিত","g"):p>0?'<span class="pl" style="background:#fef3c7;color:#b45309">আংশিক</span>':pill("অপরিশোধিত","r");
 const mr=MN.map((m,i)=>{const r=fs.filter(f=>mo(f)==mk(txY,i)),a=sm(r,"amt"),p=sm(r,"paid");return r.length?`<tr><td><b>${m}</b></td><td><b>${bn(a)}</b></td><td style="color:var(--gr)">${p?bn(p):"—"}</td><td style="color:var(--rd)"><b>${a-p?bn(a-p):"—"}</b></td><td>${st(a,p)}</td></tr>`:`<tr style="color:var(--mu)"><td>${m}</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`}).join("");
 const hist=fs.slice().sort((a,b)=>(b.date||"")>(a.date||"")?1:-1),pages=Math.max(1,Math.ceil(hist.length/5));if(txP>pages)txP=pages;if(txP<1)txP=1;
 const dt=d=>{try{return new Date(d+"T00:00:00").toLocaleDateString("bn-BD",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}};
 return `<div class="card" style="padding:10px"><div class="ch"><b>👛 একাডেমিক লেনদেন</b><select style="width:90px;margin:0" onchange="txY=+this.value;txP=1;${rf}">${[Y-2,Y-1,Y,Y+1].map(y=>`<option value="${y}" ${txY==y?"selected":""}>${bn(y)}</option>`).join("")}</select></div>
 <div style="font-size:12px;margin-bottom:8px">মোট প্রদেয় পরিমাণ/মাস : <b style="color:#3b5bdb">${bn(x.monthlyFee||0)} টাকা</b> · পরিশোধিত: <b style="color:var(--gr)">${bn(P)} ৳</b> · বকেয়া: <b style="color:var(--rd)">${bn(D)} ৳</b></div>
 <div class="ov"><table class="tb"><tr><th>মাস</th><th>মোট ফি</th><th>পরিশোধিত</th><th>বকেয়া</th><th>অবস্থা</th></tr>${mr}</table></div></div>
 <div class="card" style="padding:10px"><div class="ch"><b>লেনদেনের ইতিহাস</b>${pill(bn(hist.length)+" টি","b")}</div><div class="ov"><table class="tb"><tr><th>তারিখ</th><th>ধরন</th><th>পরিমাণ</th><th>অবস্থা</th><th>কার্যক্রম</th></tr>
 ${hist.slice((txP-1)*5,txP*5).map(f=>`<tr><td onclick="feeForm('${f.id}')">${dt(f.date)}</td><td><b>${esc(f.title)}</b></td><td><b>${bn(f.amt)} ৳</b></td><td>${st(f.amt,f.paid)}</td><td onclick="delTx('${id}','${f.id}')" style="color:var(--mu)">🗑</td></tr>`).join("")||'<tr><td colspan="5" style="text-align:center;color:var(--mu)">কোনো লেনদেন নেই</td></tr>'}</table></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mu)"><span>পৃষ্ঠা ${bn(txP)} / ${bn(pages)} · মোট ${bn(hist.length)} টি</span><span><button class="ob" style="padding:4px 10px" onclick="txP=Math.max(1,txP-1);${rf}">‹</button> <button class="ob" style="padding:4px 10px" onclick="txP=Math.min(${pages},txP+1);${rf}">›</button></span></div></div>`;
}
function stuTxn(id,keep){if(!keep){txY=new Date().getFullYear();txP=1}txM=true;const x=sOf(id);modal(HND+`<h2 style="font-size:16px;margin-bottom:8px">👛 ${esc(x.name)} — লেনদেন</h2>`+txnBody(id,`stuTxn('${id}',1)`)+`<button class="btn o" style="width:100%" onclick="closeM()">বন্ধ</button>`)}
function delTx(id,fid){if(!confirm("এই লেনদেনের রেকর্ড মুছবেন?"))return;S.fees=S.fees.filter(f=>f.id!=fid);logA("edit","ফি","ফি রেকর্ড মুছে ফেলা হয়েছে");save();if(txM)stuTxn(id,1);else render()}

/* ---- message ---- */
function msgM(ids,txt){
 const l=ids.map(pOf).filter(x=>x&&x.phone);if(!l.length){alert("মোবাইল নম্বর সহ কোনো শিক্ষার্থী নেই");return}
 mctx={ids:l.map(x=>x.id),sel:Object.fromEntries(l.map(x=>[x.id,1])),done:{},txt:txt||(l.length==1?fillT(MT,l[0]):MT)};drawMsg();
}
function drawMsg(){
 const l=mctx.ids.map(pOf),n=Object.keys(mctx.sel).length,one=l.length==1;
 modal(HND+`<h2 style="font-size:16px;margin-bottom:8px">💬 ${one?esc(l[0].guardian||l[0].name)+" -কে বার্তা পাঠান":"অভিভাবকদের বার্তা পাঠান"}</h2><label class="lb">বার্তার বিষয়বস্তু</label><textarea rows="5" oninput="mctx.txt=this.value;$('mc').textContent=bn(this.value.length)+' অক্ষর'">${esc(mctx.txt)}</textarea><small id="mc" style="color:var(--mu)">${bn(mctx.txt.length)} অক্ষর</small>
 <div style="display:flex;align-items:center;gap:8px;margin:10px 0"><input type="checkbox" class="cb" ${n==l.length?"checked":""} onchange="msgAll(this.checked)"><b style="font-size:13px;flex:1">সবাই নির্বাচন (${bn(n)} জন)</b><button class="btn g s" onclick="msgNext()">সকলকে WhatsApp</button></div>
 <div class="card" style="padding:6px">${l.map(x=>`<div class="row"><input type="checkbox" class="cb" ${mctx.sel[x.id]?"checked":""} onchange="msgTog('${x.id}')"><div class="f"><b>${esc(x.guardian||x.name)}</b>${x.guardian?` <span style="font-size:12px;color:var(--mu)">(${esc(x.name)})</span>`:""}<small>📞 ${esc(x.phone)}${mctx.done[x.id]?" ✓ পাঠানো হয়েছে":""}</small></div><button class="btn s g" onclick="msgOne('${x.id}','wa')">WA</button><button class="btn s o" onclick="msgOne('${x.id}','sms')">SMS</button></div>`).join("")}</div>
 <p style="font-size:11px;color:var(--mu);text-align:center">WhatsApp/SMS বাটনে ক্লিক করলে ফোনের অ্যাপ খুলবে — পাঠানোর পর লগ স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে। "সকলকে WhatsApp" চাপলে একে একে পরের জনের চ্যাট খুলবে। {নাম} ও {শ্রেণি} লিখলে প্রত্যেকের নাম বসবে।</p>`);
 $("mt").onclick=null;
}
function msgAll(on){mctx.sel=on?Object.fromEntries(mctx.ids.map(i=>[i,1])):{};drawMsg()}
function msgTog(id){if(mctx.sel[id])delete mctx.sel[id];else mctx.sel[id]=1;drawMsg()}
function msgOne(id,ch){const x=pOf(id);mctx.done[id]=1;sendTo(x,ch,fillT(mctx.txt,x));setTimeout(drawMsg,400)}
function msgNext(){const id=mctx.ids.find(i=>mctx.sel[i]&&!mctx.done[i]);if(!id){alert("নির্বাচিত সবাইকে পাঠানো হয়েছে");return}msgOne(id,"wa")}

function examMarks(){

function saveMarks(){const e=S.exams.find(x=>x.id==curExam);S.students.filter(s=>s.cls==e.cls).forEach(s=>{if(e.sub&&(e.sub[s.id]||[]).length)return;const v=$("m_"+s.id).value;if(v==="")delete e.marks[s.id];else e.marks[s.id]=Math.min(+v,e.total)});save();render()}

function report(){

 const ex=S.exams.filter(e=>e.cls==s.cls&&e.marks[s.id]!==undefined),ad=Object.values(S.att).filter(d=>d[s.id]),pc=ad.filter(d=>d[s.id]=="p").length;
 let T=0,M=0;
 h+=`<div class="card"><h2>${esc(S.school.name)}</h2><p style="font-size:13px;color:var(--mu)">${esc(s.name)} · শ্রেণি ${esc(s.cls)} · রোল ${esc(s.roll)}</p>`;
 h+=ex.map(e=>{const m=e.marks[s.id];const ft=(e.full&&e.full[s.id])||e.total;T+=ft;M+=m;return `<div class="row"><div class="f">${esc(e.name)}<small>${bn(e.date)}</small></div><div style="text-align:right">${bn(m)}/${bn(ft)}<small>${gr(m/ft*100)}</small></div></div>`}).join("")||'<div class="em">কোনো ফলাফল নেই</div>';
 if(T)h+=`<div class="row"><div class="f"><b>সর্বমোট</b></div><b>${bn(M)}/${bn(T)} · ${bn((M/T*100).toFixed(1))}% · ${gr(M/T*100)}</b></div>`;
 h+=`<div class="row"><div class="f">উপস্থিতি</div>${bn(pc)}/${bn(ad.length)} দিন</div>`;
 return h+"</div>";
}

async function exp(){
 const data=JSON.stringify(S),name="madrasa-backup-"+today()+".json",P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.Filesystem&&P.Share){
  try{const r=await P.Filesystem.writeFile({path:name,data:data,directory:"CACHE",encoding:"utf8"});await P.Share.share({title:"ব্যাকআপ",url:r.uri,dialogTitle:"ব্যাকআপ সংরক্ষণ করুন"});return}catch(e){if(e&&/cancel/i.test(e.message||""))return}
 }
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();if(!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()))return}catch(e){}
 modal(`<h2 style="margin-bottom:10px">ব্যাকআপ টেক্সট</h2><p style="font-size:13px;color:var(--mu);margin-bottom:8px">সব কপি করে কোথাও সেভ রাখুন (নোটস/WhatsApp)।</p><textarea id="bk" rows="8" readonly>${esc(data)}</textarea><button class="btn" style="width:100%" onclick="$('bk').select();document.execCommand('copy');alert('কপি হয়েছে')">কপি করুন</button><button class="btn o" style="width:100%;margin-top:8px" onclick="pasteImp()">পেস্ট করে রিস্টোর</button>`);
}
async function pickRestore(){
 const P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.FilePicker){
  try{
   const r=await P.FilePicker.pickFiles({limit:1,readData:true});
   const f=r.files&&r.files[0];if(!f)return;
   const txt=decodeURIComponent(escape(atob(f.data)));
   const d=JSON.parse(txt);if(!d.students)throw 0;
   S={...D(),...d};save();render();alert("রিস্টোর সম্পন্ন");return;
  }catch(e){if(e&&/cancel/i.test(e.message||""))return;alert("ফাইলটি পড়া যায়নি বা সঠিক ব্যাকআপ নয়। টেক্সট পেস্ট করে রিস্টোর করুন।");return}
 }
 $("rf").click();
}
function pasteImp(){modal(`<h2 style="margin-bottom:10px">রিস্টোর</h2><textarea id="bk" rows="8" placeholder="ব্যাকআপ টেক্সট পেস্ট করুন"></textarea><button class="btn" style="width:100%" onclick="try{const d=JSON.parse($('bk').value);if(!d.students)throw 0;S={...D(),...d};save();closeM();render();alert('রিস্টোর সম্পন্ন')}catch(e){alert('টেক্সটটি সঠিক ব্যাকআপ নয়')}">রিস্টোর করুন</button>`)}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.students)throw 0;S={...D(),...d};save();render();alert("রিস্টোর সম্পন্ন")}catch(e){alert("ফাইলটি সঠিক ব্যাকআপ নয়")}};r.readAsText(f)}

function modal(h){closeM();const m=document.createElement("div");m.className="mt";m.id="mt";m.onclick=e=>{if(e.target==m)closeM()};m.innerHTML="<div>"+h+"</div>";document.body.appendChild(m)}
function closeM(){const m=$("mt");if(m)m.remove()}
autoFees();save();render();
