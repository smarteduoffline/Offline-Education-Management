<script>

const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

let tab="home",q="",cls="",adate=today();
const TABS=[["home","🏠","হোম"],["att","✅","উপস্থিতি"],["stu","👥","শিক্ষার্থী"],["fee","👛","ফি"],["more","☰","আরও"]];
const stuName=id=>(S.students.find(s=>s.id==id)||{}).name||"—";

function render(){
 $("nv").innerHTML=TABS.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
 $("v").innerHTML=({home,att,stu,fee,more})[tab]();
}

let homeCls="",logAll=false,photoCb=null,photoDoc=false;

  for(let i=0;i<8;i++)setF(size-1-i,8,bit(b,i));for(let i=8;i<15;i++)setF(8,size-15+i,bit(b,i));setF(8,size-8,true)};
 fmt(0);
 if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const c=bit(b,i),a=size-11+i%3,d=Math.floor(i/3);setF(a,d,c);setF(d,a,c)}}
 let i=0;
 for(let right=size-1;right>=1;right-=2){if(right==6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)==0,y=up?size-1-vert:vert;if(!f[y][x]&&i<all.length*8){m[y][x]=bit(all[i>>>3],7-(i&7));i++}}}
 const MK=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
 const pen=g=>{let p=0;for(let a=0;a<size;a++)for(const dr of [0,1]){let run=1;for(let b=1;b<size;b++){const c=dr?g[b][a]:g[a][b],pr=dr?g[b-1][a]:g[a][b-1];if(c==pr){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}return p};
 let best=null,bm=0,bp=1e9;
 for(let mk=0;mk<8;mk++){const g=m.map(r=>r.slice());for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!f[y][x]&&MK[mk](x,y))g[y][x]=!g[y][x];const pp=pen(g);if(pp<bp){bp=pp;best=g;bm=mk}}
 for(let y=0;y<size;y++)for(let x=0;x<size;x++)m[y][x]=best[y][x];
 fmt(bm);
 let d="";for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(m[y][x])d+=`M${x} ${y}h1v1h-1z`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 ${size+6} ${size+6}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect x="-3" y="-3" width="${size+6}" height="${size+6}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

 const yr=fs.filter(f=>mo(f).startsWith(txY+"-")),P=sm(yr,"paid"),D=sm(yr,"amt")-P;
 const st=(a,p)=>a-p<=0?pill("পরিশোধিত","g"):p>0?'<span class="pl" style="background:#fef3c7;color:#b45309">আংশিক</span>':pill("অপরিশোধিত","r");
 const mr=MN.map((m,i)=>{const r=fs.filter(f=>mo(f)==mk(txY,i)),a=sm(r,"amt"),p=sm(r,"paid");return r.length?`<tr><td><b>${m}</b></td><td><b>${bn(a)}</b></td><td style="color:var(--gr)">${p?bn(p):"—"}</td><td style="color:var(--rd)"><b>${a-p?bn(a-p):"—"}</b></td><td>${st(a,p)}</td></tr>`:`<tr style="color:var(--mu)"><td>${m}</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`}).join("");
 const hist=fs.slice().sort((a,b)=>(b.date||"")>(a.date||"")?1:-1),pages=Math.max(1,Math.ceil(hist.length/5));if(txP>pages)txP=pages;if(txP<1)txP=1;
 const dt=d=>{try{return new Date(d+"T00:00:00").toLocaleDateString("bn-BD",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}};
 return `<div class="card" style="padding:10px"><div class="ch"><b>👛 একাডেমিক লেনদেন</b><select style="width:90px;margin:0" onchange="txY=+this.value;txP=1;${rf}">${[Y-2,Y-1,Y,Y+1].map(y=>`<option value="${y}" ${txY==y?"selected":""}>${bn(y)}</option>`).join("")}</select></div>
 <div style="font-size:12px;margin-bottom:8px">মোট প্রদেয় পরিমাণ/মাস : <b style="color:#3b5bdb">${bn(x.monthlyFee||0)} টাকা</b> · পরিশোধিত: <b style="color:var(--gr)">${bn(P)} ৳</b> · বকেয়া: <b style="color:var(--rd)">${bn(D)} ৳</b></div>

 mctx={cb,ids:l.map(x=>x.id),sel:Object.fromEntries(l.map(x=>[x.id,1])),done:{},txt:txt||(l.length==1?fillT(MT,l[0]):MT)};drawMsg();

 modal(HND+`<h2 style="font-size:16px;margin-bottom:8px">💬 ${one?esc(l[0].guardian||l[0].name)+" -কে বার্তা পাঠান":"অভিভাবকদের বার্তা পাঠান"}</h2><label class="lb">বার্তার বিষয়বস্তু</label><textarea rows="5" oninput="mctx.txt=this.value;$('mc').textContent=bn(this.value.length)+' অক্ষর'">${esc(mctx.txt)}</textarea><small id="mc" style="color:var(--mu)">${bn(mctx.txt.length)} অক্ষর</small>

 <div class="card" style="padding:6px">${l.map(x=>`<div class="row"><input type="checkbox" class="cb" ${mctx.sel[x.id]?"checked":""} onchange="msgTog('${x.id}')"><div class="f"><b>${esc(x.guardian||x.name)}</b>${x.guardian?` <span style="font-size:12px;color:var(--mu)">(${esc(x.name)})</span>`:""}<small>📞 ${esc(x.phone)}${mctx.done[x.id]?" ✓ পাঠানো হয়েছে":""}</small></div><button class="btn s g" onclick="msgOne('${x.id}','wa')">WA</button><button class="btn s o" onclick="msgOne('${x.id}','sms')">SMS</button></div>`).join("")}</div>
 <p style="font-size:11px;color:var(--mu);text-align:center">WhatsApp/SMS বাটনে ক্লিক করলে ফোনের অ্যাপ খুলবে — পাঠানোর পর লগ স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে। "সকলকে WhatsApp" চাপলে একে একে পরের জনের চ্যাট খুলবে। {নাম} ও {শ্রেণি} লিখলে প্রত্যেকের নাম বসবে।</p>`);
 $("mt").onclick=null;
}
function msgAll(on){mctx.sel=on?Object.fromEntries(mctx.ids.map(i=>[i,1])):{};drawMsg()}
function msgTog(id){if(mctx.sel[id])delete mctx.sel[id];else mctx.sel[id]=1;drawMsg()}

/* ---- admit card / id card ---- */
function schFields(list){return list.map(f=>`<label class="lb">${f[1]}</label><input id="sc_${f[0]}" value="${esc(S.school[f[0]])}" oninput="schUp()">`).join("")}
function schUp(){["name","nameEn","addr","phone","est","year","director","founder"].forEach(k=>{const e=$("sc_"+k);if(e)S.school[k]=e.value});save();pvUp()}
function pvUp(){const p=$("pv");if(!p)return;const k=cardCtx.kind;p.innerHTML=k=="id"?idHtml(sOf(cardCtx.id)):k=="rc"?rcHtml(sOf(cardCtx.id),rcPapers()):k=="sh"?shHtml(shData()):admitHtml(sOf(cardCtx.id),exGroup(cardCtx.eid))}
function exUp(){S.exg=S.exg||{};S.exg[cardCtx.eid]={center:$("ex_c").value,start:$("ex_s").value,end:$("ex_e").value};save();pvUp()}
function cardLogo(){photoCb=u=>{S.school.logo=u;save();cardRedraw()};pickPhoto()}
function cardRedraw(){const k=cardCtx.kind;if(k=="id")drawId();else if(k=="rc")drawRc();else if(k=="sh")drawSh();else drawAdmit()}
function logoRow(){return `<label class="lb">প্রতিষ্ঠানের লোগো</label><div class="row" style="border:0;padding:4px 0"><div class="av" style="width:46px;height:46px;font-size:11px">${S.school.logo?`<img class="av" style="width:46px;height:46px" src="${S.school.logo}">`:"লোগো"}</div><button class="btn o s" onclick="cardLogo()">⬆ লোগো আপলোড</button><span onclick="S.school.logo='';save();cardRedraw()" style="color:var(--rd);font-size:13px">✕ সরান</span></div><input id="ph" type="file" accept="image/*" style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px" onchange="photoFile(this.files[0]);this.value=''">`}
function admit(id){
 const x=sOf(id),gs=exGroups(e=>e.cls==x.cls);
 if(!gs.length){alert("এই শ্রেণির কোনো পরীক্ষা নেই। আগে আরও → পরীক্ষা ও ফলাফল থেকে পরীক্ষা যোগ করুন।");return}
 cardCtx={kind:"admit",id,eid:gs[gs.length-1].key};drawAdmit();
}
function drawAdmit(){
 const x=sOf(cardCtx.id),gs=exGroups(e=>e.cls==x.cls),e=exGroup(cardCtx.eid),ps=e.papers,d1=ps[0]?ps[0].date:"";
 modal(HND+`<h2 style="font-size:16px">📄 প্রবেশপত্র তৈরি — ${esc(x.name)}</h2><small style="color:var(--mu)">প্রতিষ্ঠানের তথ্য (স্বয়ংক্রিয়ভাবে লোড হয়, প্রয়োজনে সম্পাদনা করুন)</small>${logoRow()}
 ${schFields([["name","প্রতিষ্ঠানের নাম *"],["nameEn","ইংরেজি নাম"],["addr","ঠিকানা"],["phone","ফোন"],["est","স্থাপন সাল"],["director","পরিচালক / প্রধান শিক্ষক"]])}
 <label class="lb">পরীক্ষা</label><select onchange="cardCtx.eid=this.value;drawAdmit()">${gs.map(v=>`<option value="${esc(v.key)}" ${v.key==e.key?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
 <label class="lb">পরীক্ষার কেন্দ্র</label><input id="ex_c" value="${esc(e.center||S.school.name)}" oninput="exUp()">
 <div class="g2" style="margin:0"><div><label class="lb">পরীক্ষা শুরুর তারিখ</label><input id="ex_s" type="date" value="${esc(e.start||d1)}" onchange="exUp()"></div><div><label class="lb">পরীক্ষা শেষের তারিখ</label><input id="ex_e" type="date" value="${esc(e.end||(ps.length?ps[ps.length-1].date:""))}" onchange="exUp()"></div></div>
 <div id="pv" style="background:#eef3f3;padding:6px;border-radius:12px;overflow:auto;margin:6px 0">${admitHtml(x,e)}</div>
 <div class="card" style="background:#f0fdf4;padding:12px"><b style="color:#16a34a;font-size:14px">💬 অভিভাবককে পরীক্ষার সূচি পাঠান</b><div style="font-size:12px;margin:4px 0 8px;color:#16a34a">${esc(x.guardian||"অভিভাবক")}${x.phone?" ("+esc(x.phone)+")":""}-এর কাছে ${esc(e.name)} পরীক্ষার সময়সূচি পাঠান।</div><div class="g2" style="margin:0"><button class="btn g" onclick="admMsg('wa')">WhatsApp</button><button class="btn o g" style="margin:0" onclick="admMsg('sms')">SMS</button></div></div>
 <div class="g2" style="margin:0"><button class="ob" onclick="printCard()">🖨 প্রিন্ট করুন</button><button class="btn g" onclick="printCard()">⬇ PDF ডাউনলোড</button></div><button class="btn o" style="width:100%;margin-top:8px" onclick="closeM()">বন্ধ</button>`);
 $("mt").onclick=null;
}
function schedTxt(ps){return ps.map(r=>bn(r.date||"")+" — "+r.subject+((r.start||r.end)?" ("+(r.start||"")+(r.end?"-"+r.end:"")+")":"")).join("\n")}
function admMsg(ch){
 const x=sOf(cardCtx.id),e=exGroup(cardCtx.eid);if(!x.phone){alert("অভিভাবকের মোবাইল নম্বর নেই");return}
 sendTo(x,ch,"প্রিয় অভিভাবক,\n"+x.name+" ("+x.cls+")-এর "+e.name+" পরীক্ষার সূচি:\n"+(schedTxt(e.papers)||"পরীক্ষা শুরু: "+bn(e.start||""))+"\n— "+S.school.name);
}
function admitHtml(x,e){
 const sc=S.school,lg=sc.logo?`<img src="${sc.logo}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;background:#fff">`:'<div style="width:50px;height:50px;border-radius:50%;border:2px solid #7fc8d6;color:#7fc8d6;font-size:10px;display:flex;align-items:center;justify-content:center">logo</div>',
 td="border:1px solid #ddd;padding:4px 6px",rt=e.papers||[],
 dy=d=>{try{return new Date(d+"T00:00:00").toLocaleDateString("bn-BD",{weekday:"long"})}catch(z){return ""}},
 row=(l,v)=>`<div style="display:flex;font-size:13px;padding:2px 0"><span style="width:62px;color:#555">${l}</span><span>: <b>${esc(v||"—")}</b></span></div>`,
 cell="flex:1;padding:5px;border:1px solid #9fd3da";
 return `<div style="font-family:sans-serif;color:#222;border:2px solid #0f4c5c;border-radius:10px;overflow:hidden;max-width:420px;margin:10px auto;background:#fff">
 <div style="background:#0f4c5c;color:#fff;padding:10px;display:flex;align-items:center;gap:8px">${lg}<div style="text-align:center;flex:1"><div style="font-size:19px;font-weight:700">${esc(sc.name)}</div><div style="color:#ffd54a;font-size:12px;font-weight:700">${esc(sc.nameEn||"")}</div></div>${lg}</div>
 <div style="background:#127a8c;color:#fff;text-align:center;font-size:12px;padding:5px">${esc(sc.addr)}</div>
 <div style="display:flex;font-size:11px;text-align:center;background:#d9f2f5;color:#0f4c5c"><div style="${cell}">পরিচালক: ${esc(sc.director||"—")}</div><div style="${cell}">স্থাপিত: ${esc(sc.est||"—")} | শিক্ষাবর্ষ: ${esc(sc.year||"—")}</div><div style="${cell}">মোবাইল: ${esc(sc.phone||"—")}</div></div>
 <div style="text-align:center;margin:8px 0"><span style="background:#e5e7eb;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700">প্রবেশ পত্র / ADMIT CARD</span></div>
 <div style="display:flex;justify-content:space-between;gap:8px;padding:0 12px 8px"><div style="flex:1;min-width:0">${row("নাম",x.name)}${row("রোল নং",x.roll)}${row("শ্রেণি",x.cls+(x.branch?" ("+x.branch+")":""))}${row("পরীক্ষা",e.name)}${row("কেন্দ্র",e.center||sc.name)}</div>${x.photo?`<img src="${x.photo}" style="width:70px;height:82px;object-fit:cover;border-radius:4px">`:'<div style="width:70px;height:82px;background:#eee;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:30px">👤</div>'}</div>
 <div style="background:#1e2a4a;color:#fff;font-size:12px;font-weight:700;padding:5px 10px">পরীক্ষার সূচি</div>
 ${rt.length?`<table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th style="${td}">তারিখ</th><th style="${td}">বার</th><th style="${td}">বিষয়</th><th style="${td}">সময়</th></tr>${rt.map(r=>`<tr><td style="${td}">${bn(r.date||"")}</td><td style="${td}">${r.date?dy(r.date):""}</td><td style="${td}">${esc(r.subject)}</td><td style="${td}">${esc((r.start||"")+(r.end?" - "+r.end:""))}</td></tr>`).join("")}</table>`:`<div style="text-align:center;color:#888;font-size:12px;padding:12px">পরীক্ষার সূচি পাওয়া যায়নি। আরও → পরীক্ষা ও ফলাফল থেকে "${esc(e.name)}" পরীক্ষায় সূচি যোগ করুন।</div>`}
 <div style="margin:10px;border:1px solid #fca5a5;background:#fff5f5;border-radius:8px;padding:8px;font-size:12px"><b style="color:#c62828">⚠ গুরুত্বপূর্ণ নির্দেশনা:</b><ul style="margin:4px 0 0 16px;padding:0"><li>পরীক্ষার ৩০ মিনিট আগে কেন্দ্রে উপস্থিত থাকতে হবে।</li><li>প্রবেশপত্র ছাড়া পরীক্ষায় অংশগ্রহণ করা যাবে না।</li><li>হলে মোবাইল ফোন আনা নিষিদ্ধ।</li></ul></div></div>`;
}
function idCard(id){cardCtx={kind:"id",id};drawId()}
function drawId(){
 const x=sOf(cardCtx.id);
 modal(HND+`<h2 style="font-size:16px;text-align:center">শিক্ষার্থী আইডি কার্ড — ${esc(x.name)}</h2>${logoRow()}
 ${schFields([["name","প্রতিষ্ঠানের নাম (বাংলা)"],["nameEn","প্রতিষ্ঠানের নাম (English)"],["addr","ঠিকানা"],["est","স্থাপিত"],["year","শিক্ষাবর্ষ"],["founder","প্রতিষ্ঠাতার নাম"],["director","পরিচালকের নাম"],["phone","পরিচালকের মোবাইল"]])}
 <div id="pv" style="background:#e8eeee;padding:8px;border-radius:12px;overflow:auto;margin:10px 0">${idHtml(x)}</div>
 <div class="g2" style="margin:0"><button class="ob" onclick="printCard()">🖨 প্রিন্ট</button><button class="btn g" onclick="printCard()">⬇ ডাউনলোড</button></div><button class="btn o" style="width:100%;margin-top:8px" onclick="closeM()">বন্ধ</button>`);
 $("mt").onclick=null;
}
function idHtml(x){
 const sc=S.school,lg=z=>sc.logo?`<img src="${sc.logo}" style="width:${z}px;height:${z}px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #f5c518">`:`<div style="width:${z}px;height:${z}px;border-radius:50%;background:#fff;border:2px solid #f5c518;display:flex;align-items:center;justify-content:center;font-size:${Math.round(z/2)}px">🕌</div>`,
 cl=x.cls+(x.branch?" ("+x.branch+")":""),
 r=(l,v)=>`<div style="display:flex;font-size:11px;padding:2px 0"><span style="width:56px;color:#444">${l}</span><span style="flex:1">: ${esc(v||"—")}</span></div>`,
 qr=qrSvg([sc.name,x.name,"শ্রেণি: "+cl,"রোল: "+(x.roll||""),"মোবাইল: "+(x.phone||"")].join("\n"),96),
 w="width:260px;margin:10px auto;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0003;font-family:sans-serif;color:#222;background:#fff";
 return `<div style="${w}"><div style="background:#146c3a;color:#fff;text-align:center;padding:10px 8px 30px"><div style="display:flex;justify-content:space-between;align-items:center;gap:4px">${lg(30)}<div><b style="font-size:14px">${esc(sc.name)}</b><div style="font-size:9px;color:#ffd54a">${esc(sc.nameEn||"")}</div></div>${lg(30)}</div><div style="font-size:9px;margin-top:3px">${esc(sc.addr)}</div><div style="font-size:9px;color:#ffd54a">স্থাপিত: ${esc(sc.est||"—")} | শিক্ষাবর্ষ: ${esc(sc.year||"—")}</div><div style="color:#ffd54a;font-weight:700;font-size:13px;margin-top:4px">পরিচয়পত্র</div></div>
 <div style="background:#f5c518;height:5px"></div><div style="text-align:center;margin-top:-22px"><div style="display:inline-block;border:4px solid #f5c518;border-radius:50%;background:#fff;line-height:0">${avt(x,64)}</div></div>
 <div style="text-align:center;color:#d32f2f;font-weight:700;font-size:16px;margin:4px 0">${esc(x.name)}</div><div style="padding:0 16px 8px">${r("পিতা",x.guardian)}${r("রোল",x.roll)}${r("শ্রেণি",cl)}${r("শিক্ষাবর্ষ",sc.year)}${r("মোবা",x.phone)}${r("ঠিকানা",x.addr)}</div>
 <div style="background:#d98a2b;color:#fff;text-align:right;padding:8px 12px;font-size:10px"><div style="border-top:1px solid #fff;display:inline-block;padding-top:2px">পরিচালকের স্বাক্ষর<br><b>${esc(sc.director||"")}</b></div></div></div>
 <div style="${w}"><div style="background:#d98a2b;height:12px"></div><div style="text-align:center;padding:10px">${qr}<div style="font-size:9px;color:#555">শিক্ষার্থীর তথ্য স্ক্যান করুন</div><b style="font-size:13px;display:block;margin-top:6px">${esc(sc.name)}</b><div style="font-size:10px">${esc(sc.nameEn||"")}</div><div style="font-size:10px;color:#146c3a">${esc(sc.addr)}</div><div style="font-size:10px;color:#146c3a">স্থাপিত: ${esc(sc.est||"—")}</div><div style="font-size:10px;margin-top:4px">প্রতিষ্ঠাতা: ${esc(sc.founder||"—")}</div><div style="font-size:10px">পরিচালক: ${esc(sc.director||"—")}</div><b style="font-size:11px">যোগাযোগ: ${esc(sc.phone||"—")}</b><div style="margin-top:6px">${lg(34)}</div></div>
 <div style="background:#146c3a;color:#fff;font-size:9px;text-align:center;padding:10px 12px;border-top:4px solid #f5c518;line-height:1.5">এই কার্ডটি শুধু প্রতিষ্ঠানের একটি সম্পত্তি। যদি এই কার্ডটি কোথাও পাওয়া যায় তবে দয়া করে উপরের ঠিকানায় ফেরত দেওয়ার অনুরোধ রইলো।</div></div>`;
}
function printCard(){const x=cardCtx.id?sOf(cardCtx.id):null,k=cardCtx.kind;if(k=="id")printDoc("id-card",idHtml(x));else if(k=="rc")printDoc("report-card",rcHtml(x,rcPapers()));else if(k=="sh")printDoc("result-sheet",shHtml(shData()));else printDoc("admit-card",admitHtml(x,exGroup(cardCtx.eid)))}

/* ---- full profile page ---- */
function resDoc(id){const x=sOf(id);return `<h2>${esc(S.school.name)}</h2><p><b>${esc(x.name)}</b> — শ্রেণি ${esc(x.cls)} | রোল: ${esc(x.roll)} — ফলাফল</p>`+(exGroups(e=>e.cls==x.cls).map(g=>{const r=stuRes(x,g.papers);return r.n?`<h3>${esc(g.name)}</h3><table><tr><th>বিষয়</th><th>পূর্ণমান</th><th>প্রাপ্ত</th><th>%</th><th>গ্রেড</th><th>GPA</th></tr>${r.rows.map(q=>`<tr><td>${esc(q.p.subject)}</td><td>${bn(q.f)}</td><td>${bn(q.g)}</td><td>${bn(q.pc.toFixed(0))}%</td><td>${q.gr}</td><td>${bn(q.gp.toFixed(2))}</td></tr>`).join("")}</table>`:""}).join("")||"<p>কোনো ফলাফল নেই</p>")}
function profilePage(){
 const x=sOf(profId);if(!x){profId="";return stu()}
 const Y=new Date().getFullYear(),ad=Object.keys(S.att).filter(d=>S.att[d][x.id]),pcn=ad.filter(d=>S.att[d][x.id]=="p"||S.att[d][x.id]=="l").length,pr=ad.length?Math.round(pcn/ad.length*100):0,ab=ad.filter(d=>S.att[d][x.id]=="a").length;
 const subj=S.exams.reduce((a,e)=>a+(((e.sub||{})[x.id])||[]).length,0),logs=S.smslog.filter(l=>l.sid==x.id);
 const kv=(l,v)=>`<div class="row" style="padding:8px 0"><div class="f" style="color:var(--mu);font-size:13px">${l}</div><span style="text-align:right">${esc(v||"-")}</span></div>`;
 const stat=(n,l,sub,c)=>`<div class="card" style="margin:0;padding:12px"><b style="font-size:22px;color:${c}">${n}</b><div style="font-size:13px">${l}</div><small style="color:var(--mu)">${sub}</small></div>`;
 const TB=[["info","ব্যক্তিগত তথ্য"],["res","ফলাফল"],["att","উপস্থিতি"],["log","যোগাযোগ লগ"],["txn","লেনদেন"]];
 let c="";
 if(profTab=="info")c=`<div class="card"><h2>👤 ব্যক্তিগত তথ্য</h2>${kv("পূর্ণ নাম (বাংলা)",x.name)}${kv("পূর্ণ নাম (ইংরেজি)",x.nameEn)}${kv("লিঙ্গ",x.gender)}${kv("জন্ম তারিখ",x.dob)}${kv("রক্তের গ্রুপ",x.blood)}${kv("ভর্তির তারিখ",x.admDate)}${kv("মাসিক বেতন",x.monthlyFee?money(x.monthlyFee):"")}</div><div class="card"><h2>📞 অভিভাবক ও যোগাযোগ</h2>${kv("অভিভাবকের নাম",x.guardian)}${kv("মোবাইল নম্বর",x.phone)}${kv("ঠিকানা",x.addr)}${kv("শ্রেণি",x.cls)}${kv("শাখা",x.branch)}${kv("রোল নম্বর",x.roll)}<div class="top" style="margin:10px 0 0"><button class="btn g s" onclick="msgM(['${x.id}'])">💬 অভিভাবককে বার্তা</button><button class="btn o s" onclick="stuForm('${x.id}')">✏️ সম্পাদনা</button></div></div>`;

function evCard(e){return `<div class="card" style="border-left:4px solid ${EVT[e.type]||"#8b5cf6"};padding:10px;margin-bottom:8px"><div class="ch" style="margin:0"><b>${esc(e.name)}</b>${e.auto?"":`<span onclick="evForm('${e.id}')" style="padding:0 6px">✏️</span>`}</div><span class="pl" style="background:${EVT[e.type]||"#8b5cf6"}22;color:${EVT[e.type]||"#8b5cf6"}">${EVI[e.type]||""} ${esc(e.type)}</span><div style="font-size:12px;color:var(--mu)">📅 ${bn(e.start)}${e.end&&e.end!=e.start?" — "+bn(e.end):""}${e.place?" · 📍 "+esc(e.place):""}</div>${e.desc?`<div style="font-size:12px;margin-top:4px">${esc(e.desc)}</div>`:""}</div>`}
function ev(){
 const all=evAll(),mo=mk(evY,evM),first=(new Date(evY,evM,1).getDay()+1)%7,dim=new Date(evY,evM+1,0).getDate(),T=today();
 const cells=Array.from({length:first},()=>"<div></div>").concat(Array.from({length:dim},(_,i)=>{const d=mo+"-"+p2(i+1),es=evOn(d);return `<div class="cd ${d==evSel?"sel":""} ${d==T?"td":""}" onclick="evSel='${d}';render()"><span>${bn(i+1)}</span><div>${es.slice(0,3).map(e=>`<i style="background:${EVT[e.type]||"#8b5cf6"}"></i>`).join("")}</div></div>`}));
 const lst=all.slice().sort((a,b)=>a.start>b.start?1:-1);
 return phdr("ইভেন্ট ও ছুটির ক্যালেন্ডার","ইভেন্ট, পরীক্ষা ও ছুটির তালিকা")+`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" style="background:#f97316" onclick="evForm()">＋ নতুন ইভেন্ট</button><button class="ob" onclick="evPdf()">🗎 PDF</button></div>
 <div class="g2">${["ইভেন্ট","ছুটি","পরীক্ষা","সভা"].map(t=>`<div class="sc" style="background:${EVT[t]}22"><i style="color:${EVT[t]}">${EVI[t]}</i><div><b style="color:${EVT[t]}">${bn(all.filter(e=>e.type==t).length)}</b><small>${t}</small></div></div>`).join("")}</div>
 <div class="seg" style="width:70%">${[["cal","ক্যালেন্ডার"],["list","তালিকা"]].map(v=>`<button class="${evView==v[0]?"on":""}" style="${evView==v[0]?"color:#f97316":""}" onclick="evView='${v[0]}';render()">${v[1]}</button>`).join("")}</div>`
 +(evView=="cal"?`<div class="card" style="padding:10px"><div class="ch"><button class="ob" style="padding:4px 12px" onclick="evMv(-1)">‹</button><b>${MN[evM]} ${bn(evY)}</b><button class="ob" style="padding:4px 12px" onclick="evMv(1)">›</button></div><div class="cal">${DSH.map(d=>`<div class="wd">${d}</div>`).join("")}${cells.join("")}</div></div><b style="font-size:14px">${bn(evSel)} তারিখের ইভেন্ট</b><div style="margin-top:8px">${evOn(evSel).map(evCard).join("")||'<div class="em">এই দিনে কোনো ইভেন্ট নেই</div>'}</div>`:lst.map(evCard).join("")||'<div class="em">কোনো ইভেন্ট নেই</div>');
}
function evMv(n){evM+=n;if(evM<0){evM=11;evY--}if(evM>11){evM=0;evY++}render()}
function evForm(id){
 const e=S.events.find(x=>x.id==id)||{type:"ইভেন্ট",start:evSel||today()};
 modal(HND+`<h2 style="text-align:center;font-size:16px;margin-bottom:6px">${id?"ইভেন্ট সম্পাদনা":"নতুন ইভেন্ট যোগ"}</h2>${fi("ইভেন্টের নাম","ev_n",e.name,"text",1,"ইভেন্টের নাম লিখুন")}<div class="g2" style="margin:0"><div>${fsel("ধরন","ev_t",Object.keys(EVT),e.type,1)}</div><div>${fi("স্থান","ev_p",e.place,"text",0,"স্থান")}</div><div>${fi("তারিখ","ev_s",e.start,"date",1)}</div><div>${fi("শেষ তারিখ","ev_e",e.end,"date")}</div></div><label class="lb">বিবরণ</label><textarea id="ev_d" rows="3" placeholder="বিবরণ">${esc(e.desc)}</textarea>${fi("মন্তব্য","ev_o",e.note,"text",0,"অতিরিক্ত তথ্য (ঐচ্ছিক)")}
 <div class="bt"><button class="btn o" onclick="closeM()">বাতিল</button><button class="btn" onclick="evSave('${id||""}')">সংরক্ষণ</button></div>${id?`<button class="btn r" style="width:100%;margin-top:8px" onclick="evDel('${id}')">মুছে ফেলুন</button>`:""}`);$("mt").onclick=null;
}
function evSave(id){
 const o={name:gv("ev_n"),type:gv("ev_t"),place:gv("ev_p"),start:gv("ev_s"),end:gv("ev_e"),desc:gv("ev_d"),note:gv("ev_o")};
 if(!o.name||!o.start){alert("ইভেন্টের নাম ও তারিখ দিন");return}
 if(o.end&&o.end<o.start){alert("শেষ তারিখ শুরুর আগে হতে পারে না");return}
 if(id)Object.assign(S.events.find(x=>x.id==id),o);else S.events.push({id:uid(),...o});
 logA(id?"edit":"add","ইভেন্ট",(id?"ইভেন্ট আপডেট: ":"নতুন ইভেন্ট: ")+o.name);save();closeM();render();
}
function evDel(id){if(!confirm("ইভেন্টটি মুছবেন?"))return;S.events=S.events.filter(x=>x.id!=id);save();closeM();render()}
function evPdf(){
 const mo=mk(evY,evM),l=evAll().filter(e=>e.start.slice(0,7)<=mo&&(e.end||e.start).slice(0,7)>=mo).sort((a,b)=>a.start>b.start?1:-1);
 printDoc("events",sch()+`<style>.st td,.st th{border:1px solid #c7d2fe;font-size:12px;padding:6px 7px}</style><div style="text-align:center;margin-bottom:10px">ইভেন্ট ও ছুটির ক্যালেন্ডার — ${MN[evM]} ${bn(evY)}</div><table class="st" style="border:1px solid #1d4ed8"><tr><th>তারিখ</th><th>ইভেন্ট</th><th>ধরন</th><th>স্থান</th><th>বিবরণ</th></tr>${l.map(e=>`<tr><td>${bn(e.start)}${e.end&&e.end!=e.start?" — "+bn(e.end):""}</td><td>${esc(e.name)}</td><td>${esc(e.type)}</td><td>${esc(e.place||"")}</td><td>${esc(e.desc||"")}</td></tr>`).join("")||'<tr><td colspan="5">কোনো ইভেন্ট নেই</td></tr>'}</table>`);
}

/* ---- homework ---- */
let hwDate=today(),hwCls="",hwF=null;
const hwList=()=>S.hw.filter(h=>(!hwDate||h.date==hwDate)&&(!hwCls||h.cls==hwCls));
function hw(){
 const l=hwList();
 return phdr("আজকের পড়া ও বাড়ির কাজ","শ্রেণিভিত্তিক দৈনিক পড়া ও বাড়ির কাজ আপডেট করুন")+`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" onclick="hwForm()">＋ নতুন কাজ যোগ</button><button class="ob" onclick="hwPdf()">🗎 PDF</button></div>
 <div class="g2"><input type="date" value="${hwDate}" onchange="hwDate=this.value;render()" style="margin:0"><select onchange="hwCls=this.value;render()" style="margin:0"><option value="">সব শ্রেণী</option>${allCls().map(c=>`<option ${hwCls==c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`
 +(l.map(h=>`<div class="card"><div class="ch" style="margin:0"><div><b>${esc(h.subject)}</b> <span class="pl b">${esc(h.cls)}</span></div><span onclick="hwForm('${h.id}')" style="padding:0 6px">✏️</span></div>${h.title?`<div style="font-size:14px;margin-top:4px"><b>${esc(h.title)}</b></div>`:""}${h.lesson?`<div style="font-size:13px;margin-top:4px">📖 আজকের পড়া: ${esc(h.lesson)}</div>`:""}${(h.homework||h.text)?`<div style="font-size:13px;margin-top:4px">📝 বাড়ির কাজ: ${esc(h.homework||h.text)}</div>`:""}${h.teacher?`<small style="color:var(--mu)">👤 ${esc(h.teacher)}</small>`:""}</div>`).join("")||`<div class="card" style="text-align:center;padding:24px"><div style="font-size:34px;color:var(--mu)">📖</div><div style="color:var(--mu);margin:8px 0">আজকের পড়া এখনো আপডেট হয়নি</div><button class="btn s" onclick="hwForm()">＋ আপডেট করুন</button></div>`);
}
function hwForm(id){
 if(!allCls().length){alert("আগে শিক্ষার্থী যোগ করুন");return}
 const o=S.hw.find(x=>x.id==id);
 hwF=o?{id,date:o.date,cls:o.cls,teacher:o.teacher||"",blocks:[{subject:o.subject,title:o.title||"",lesson:o.lesson||"",homework:o.homework||o.text||""}]}:{id:null,date:hwDate||today(),cls:hwCls||allCls()[0],teacher:"",blocks:[{subject:"",title:"",lesson:"",homework:""}]};
 drawHw();
}
function hwGrab(){hwF.date=gv("hf_d");hwF.cls=gv("hf_c");hwF.teacher=gv("hf_t");hwF.blocks.forEach((b,i)=>{b.subject=gv("hb"+i+"s");b.title=gv("hb"+i+"t");b.lesson=gv("hb"+i+"l");b.homework=gv("hb"+i+"h")})}
function hwAddB(){hwGrab();hwF.blocks.push({subject:"",title:"",lesson:"",homework:""});drawHw()}
function hwRm(i){hwGrab();hwF.blocks.splice(i,1);drawHw()}
function drawHw(){
 const subs=[...new Set(S.tbooks.map(b=>b.subject).filter(Boolean).concat(S.exams.flatMap(e=>Object.values(e.sub||{}).flat().map(r=>r.s))))];
 modal(HND+`<h2 style="text-align:center;font-size:16px;margin-bottom:6px">${hwF.id?"কাজ সম্পাদনা":"নতুন পড়া ও বাড়ির কাজ"}</h2><div class="g2" style="margin:0"><div>${fi("তারিখ","hf_d",hwF.date,"date",1)}</div><div>${fsel("শ্রেণী","hf_c",allCls(),hwF.cls,1)}</div></div><datalist id="hsub">${subs.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`
 +hwF.blocks.map((b,i)=>`<div class="card" style="padding:10px;margin:8px 0"><div class="ch" style="margin:0"><b style="font-size:13px">বিষয় ${bn(i+1)}</b>${hwF.blocks.length>1?`<span onclick="hwRm(${i})" style="color:var(--rd);padding:0 6px">✕</span>`:""}</div>${fi("বিষয়","hb"+i+"s",b.subject,"text",1,"বিষয়ের নাম",'list="hsub"')}${fi("শিরোনাম","hb"+i+"t",b.title,"text",0,"পাঠের শিরোনাম")}<label class="lb">আজকের পড়া/টাস্ক (নির্দেশনা)</label><textarea id="hb${i}l" rows="2" placeholder="কোন অধ্যায়/পৃষ্ঠা পড়াতে হবে">${esc(b.lesson)}</textarea><label class="lb">বাড়ির কাজ</label><textarea id="hb${i}h" rows="2" placeholder="বাড়ির কাজ কী করতে হবে...">${esc(b.homework)}</textarea></div>`).join("")
 +(hwF.id?"":`<button class="btn o s" style="width:100%;margin-bottom:6px" onclick="hwAddB()">＋ আরও বিষয় যোগ করুন</button>`)+fi("শিক্ষকের নাম (ঐচ্ছিক)","hf_t",hwF.teacher,"text",0,"শিক্ষকের নাম")
 +`<div class="bt"><button class="btn o" onclick="closeM()">বাতিল</button><button class="btn" onclick="hwSave()">সংরক্ষণ</button></div>${hwF.id?`<button class="btn r" style="width:100%;margin-top:8px" onclick="hwDel('${hwF.id}')">মুছে ফেলুন</button>`:""}`);$("mt").onclick=null;
}
function hwSave(){
 hwGrab();const f=hwF,bl=f.blocks.filter(b=>b.subject);
 if(!f.date||!f.cls||!bl.length){alert("তারিখ, শ্রেণী ও অন্তত একটি বিষয় দিন");return}
 const mkE=b=>({cls:f.cls,date:f.date,subject:b.subject,title:b.title,lesson:b.lesson,homework:b.homework,teacher:f.teacher,text:b.homework||b.lesson||b.title});
 if(f.id)Object.assign(S.hw.find(x=>x.id==f.id),mkE(bl[0]));else bl.forEach(b=>S.hw.push({id:uid(),...mkE(b)}));
 logA(f.id?"edit":"add","পড়া ও বাড়ির কাজ",f.cls+" — "+bl.map(b=>b.subject).join(", "));hwDate=f.date;save();closeM();render();
}
function hwDel(id){if(!confirm("মুছে ফেলবেন?"))return;S.hw=S.hw.filter(x=>x.id!=id);save();closeM();render()}
function hwPdf(){
 const l=hwList();
 printDoc("homework",sch()+`<style>.st td,.st th{border:1px solid #c7d2fe;font-size:12px;padding:6px 7px}</style><div style="text-align:center;margin-bottom:10px">পড়া ও বাড়ির কাজ — তারিখ: ${bn(hwDate||"সব")}${hwCls?" · শ্রেণি: "+esc(hwCls):""}</div><table class="st" style="border:1px solid #1d4ed8"><tr><th>শ্রেণি</th><th>বিষয়</th><th>শিরোনাম</th><th>আজকের পড়া</th><th>বাড়ির কাজ</th><th>শিক্ষক</th></tr>${l.map(h=>`<tr><td>${esc(h.cls)}</td><td>${esc(h.subject)}</td><td>${esc(h.title||"")}</td><td>${esc(h.lesson||"")}</td><td>${esc(h.homework||h.text||"")}</td><td>${esc(h.teacher||"")}</td></tr>`).join("")||'<tr><td colspan="6">কিছু নেই</td></tr>'}</table>`);
}

let bkCls="",bkD={},bkId=null,pdfCb=null;
async function pickPdf(cb){
 pdfCb=cb;const P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.FilePicker){try{const r=await P.FilePicker.pickFiles({types:["application/pdf"],limit:1,readData:true});const f=r.files&&r.files[0];if(!f)return;if(f.size&&f.size>1048576){alert("PDF ১ MB-এর বেশি হতে পারবে না");return}cb("data:application/pdf;base64,"+f.data,f.name);return}catch(e){if(e&&/cancel/i.test(e.message||""))return}}
 $("pdfin").click();
}
function pdfFile(f){if(!f)return;if(f.size>1048576){alert("PDF ১ MB-এর বেশি হতে পারবে না");return}const r=new FileReader();r.onload=()=>{if(pdfCb)pdfCb(r.result,f.name)};r.readAsDataURL(f)}
function bk(){
 const cl=[...new Set(S.tbooks.map(b=>b.cls))],l=S.tbooks.filter(b=>!bkCls||b.cls==bkCls);
 return phdr("শ্রেণী ও পাঠ্যবই","শ্রেণিভিত্তিক পাঠ্যবইয়ের তালিকা")+`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" onclick="bkForm()">＋ নতুন পাঠ্যবই</button><button class="ob" onclick="bkPdf()">🗎 PDF</button></div>
 <div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:10px"><button class="chip ${bkCls?"":"on"}" onclick="bkCls='';render()">সব (${bn(S.tbooks.length)})</button>${cl.map(c=>`<button class="chip ${bkCls==c?"on":""}" onclick="bkCls='${esc(c)}';render()">${esc(c)} (${bn(S.tbooks.filter(b=>b.cls==c).length)})</button>`).join("")}</div>`
 +(l.map(b=>`<div class="card"><div class="ch" style="margin:0"><div><b>${esc(b.name)}</b> <span class="pl b">${esc(b.cls)}</span></div><span onclick="bkForm('${b.id}')" style="padding:0 6px">✏️</span></div><div style="font-size:12px;color:var(--mu);line-height:1.7;margin-top:4px">${b.subject?"বিষয়: "+esc(b.subject)+"<br>":""}${b.author?"✍ "+esc(b.author)+"<br>":""}${b.code?"বই নম্বর: "+esc(b.code):""}${b.shelf?" · তাক: "+esc(b.shelf):""}${b.copies?"<br>সংখ্যা: "+bn(b.copies):""}${b.price?" · মূল্য: "+money(b.price):""}</div>${b.syllabus?`<div style="font-size:12px;margin-top:4px">${esc(b.syllabus)}</div>`:""}${b.pdf?`<button class="btn o s" style="margin-top:8px" onclick="bkOpen('${b.id}')">📄 PDF খুলুন</button>`:""}</div>`).join("")||'<div class="em">কোনো পাঠ্যবই নেই। "নতুন পাঠ্যবই" চাপুন।</div>');
}
function bkForm(id){bkId=id||null;const o=S.tbooks.find(x=>x.id==id);bkD=o?{...o}:{cls:bkCls||"",copies:1};drawBk()}

 <label class="lb">বইয়ের PDF</label><div class="row" style="border:0;padding:2px 0"><button class="btn o s" onclick="bkPick()">⬆ PDF আপলোড করুন</button>${bkD.pdf?`<span style="font-size:12px">✓ ${esc(bkD.pdfName||"PDF")}</span><span onclick="bkGrab();bkD.pdf='';drawBk()" style="color:var(--rd);font-size:13px">✕</span>`:""}</div><input id="pdfin" type="file" accept="application/pdf" style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px" onchange="pdfFile(this.files[0]);this.value=''"><div class="hint">সর্বোচ্চ ১ MB</div>
 <label class="lb">বিবরণ / সিলেবাস (ঐচ্ছিক)</label><textarea id="bk_syllabus" rows="2" placeholder="বিবরণ / সিলেবাস">${esc(bkD.syllabus)}</textarea>${fi("নোট","bk_note",bkD.note,"text",0,"অতিরিক্ত তথ্য (ঐচ্ছিক)")}

function ieFee(ym){
 const rec=S.fees.filter(f=>fym(f)==ym),tot=rec.reduce((a,f)=>a+f.amt,0),pd=rec.reduce((a,f)=>a+f.paid,0),pays=incOf(ym).filter(x=>x.src=="fee");

function ieReport(ym){

 const tb=(h,l)=>`<table style="width:100%;border-collapse:collapse;font-size:11px;margin:4px 0 10px"><tr style="background:#f3f4f6">${h.map(x=>`<th style="padding:5px;text-align:left;border-bottom:1px solid #ddd">${x}</th>`).join("")}</tr>${l.join("")||`<tr><td colspan="${h.length}" style="padding:8px;color:#888">কোনো তথ্য নেই</td></tr>`}</table>`;
 const gl=l=>grpCat(l).map(([k,v])=>`<tr><td style="padding:4px;border-bottom:1px solid #eee">${esc(k)}</td><td style="padding:4px;text-align:right;border-bottom:1px solid #eee">${money(v)}</td></tr>`);
 const dl=l=>l.map((x,i)=>`<tr><td style="padding:4px;border-bottom:1px solid #eee">${bn(i+1)}</td><td style="padding:4px;border-bottom:1px solid #eee">${esc(x.desc)}</td><td style="padding:4px;border-bottom:1px solid #eee">${esc(x.cat)}</td><td style="padding:4px;border-bottom:1px solid #eee">${esc(x.method)}</td><td style="padding:4px;border-bottom:1px solid #eee">${bn(x.date||"")}</td><td style="padding:4px;text-align:right;border-bottom:1px solid #eee">${money(x.amt)}</td></tr>`);
 return `<div style="font-family:sans-serif;color:#222;background:#fff;padding:14px;border-radius:10px;max-width:520px;margin:0 auto"><div style="text-align:center"><b style="font-size:19px">${esc(sc.name)}</b><div style="color:#2563eb;font-weight:700;margin-top:2px">মাসিক আয়-ব্যয় সামারি রিপোর্ট</div><div style="font-size:10px;color:#777">মাস: ${MN[+ym.slice(5)-1]} ${bn(ym.slice(0,4))} &nbsp;|&nbsp; তৈরি: ${bn(today().split("-").reverse().join("/"))}</div></div><div style="border-top:3px solid #3b82f6;margin:8px 0 10px"></div>
 <div style="display:flex;gap:6px;margin-bottom:12px">${tl("মোট আয়",money(ti),"#16a34a","#f0fdf4")}${tl("মোট ব্যয়",money(te),"#dc2626","#fff1f2")}${tl("মাসিক নিট",money(ti-te),"#2563eb","#eff6ff")}${tl("বর্তমান ব্যালেন্স",money(bal),"#7c3aed","#faf5ff")}</div>
 <div style="display:flex;gap:10px"><div style="flex:1"><b style="font-size:12px">আয়ের খাত বিস্তারিত (${bn(grpCat(inc).length)}টি)</b>${tb(["খাত","পরিমাণ"],gl(inc))}</div><div style="flex:1"><b style="font-size:12px">ব্যয়ের খাত বিস্তারিত (${bn(grpCat(exp).length)}টি)</b>${tb(["খাত","পরিমাণ"],gl(exp))}</div></div>
 <b style="font-size:12px">আয়ের বিবরণ (${bn(inc.length)}টি লেনদেন)</b>${tb(["#","বিবরণ","ধরন","মাধ্যম","তারিখ","পরিমাণ"],dl(inc))}<b style="font-size:12px">ব্যয়ের বিবরণ (${bn(exp.length)}টি লেনদেন)</b>${tb(["#","বিবরণ","ধরন","মাধ্যম","তারিখ","পরিমাণ"],dl(exp))}<div style="font-size:9px;color:#888;display:flex;justify-content:space-between;border-top:1px solid #eee;padding-top:6px"><span>সিস্টেম কর্তৃক স্বয়ংক্রিয়ভাবে তৈরি</span><span>তৈরির তারিখ: ${bn(today().split("-").reverse().join("/"))}</span></div></div>`;
}

function txForm(t,id){txT=t;txId=id||null;const o=S.txns.find(x=>x.id==id);txD=o?{...o}:{date:today(),method:"নগদ"};drawTx()}
function drawTx(){
 const inc=txT=="in";
 modal(HND+`<h2 style="text-align:center;font-size:16px;margin-bottom:6px">${txId?(inc?"আয় সম্পাদনা":"ব্যয় সম্পাদনা"):(inc?"নতুন আয় যোগ":"নতুন ব্যয় যোগ")}</h2>${fi("বিবরণ","tx_t",txD.title,"text",1,inc?"যেমন: জানুয়ারি মাসের বেতন":"যেমন: জানুয়ারি মাসের বিদ্যুৎ বিল")}<div class="g2" style="margin:0"><div>${fsel("ধরন","tx_c",inc?INC:EXC,txD.cat,1,"নির্বাচন করুন")}</div><div>${fi("পরিমাণ (৳)","tx_a",txD.amt,"number",1,"0")}</div><div>${fi("তারিখ","tx_d",txD.date,"date",1)}</div><div>${fsel("মাধ্যম","tx_m",PM,txD.method,0,"নির্বাচন করুন")}</div></div>${fi(inc?"উৎস":"পরিশোধ করা হয়েছে","tx_s",txD.src,"text",0,inc?"যেমন: অভিভাবকের নাম":"যেমন: শিক্ষকের নাম / ঠিকাদার")}<label class="lb">নোট</label><textarea id="tx_n" rows="3">${esc(txD.note)}</textarea><div class="bt"><button class="btn o" onclick="closeM()">বাতিল</button><button class="btn ${inc?"":"r"}" onclick="txSave()">সংরক্ষণ করুন</button></div>`);$("mt").onclick=null;
}
function txSave(){
 const o={type:txT,title:gv("tx_t"),cat:gv("tx_c"),amt:+gv("tx_a"),date:gv("tx_d"),method:gv("tx_m"),src:gv("tx_s"),note:gv("tx_n")};
 if(!o.title||!o.cat||!(o.amt>0)||!o.date){alert("বিবরণ, ধরন, পরিমাণ ও তারিখ দিন");return}
 if(txId)Object.assign(S.txns.find(x=>x.id==txId),o);else S.txns.push({id:uid(),...o});
 logA(txId?"edit":"add",txT=="in"?"আয়":"ব্যয়",o.title+" — "+money(o.amt));save();closeM();render();
}
function txDel(id){if(!confirm("মুছে ফেলবেন?"))return;S.txns=S.txns.filter(x=>x.id!=id);save();render()}

const people=()=>S.teachers.filter(t=>t.status!="নিষ্ক্রিয়").map(t=>({...t,kind:"শিক্ষক"})).concat(S.staff.filter(t=>t.status!="নিষ্ক্রিয়").map(t=>({...t,kind:"কর্মী"})));
const slYm=()=>mk(slY,slM),salRec=(pid,ym)=>S.sal.find(r=>r.pid==pid&&r.ym==ym&&r.type!="adv"),slDue=r=>r.base-r.paid;
function slStat(r){if(!r)return ["অপ্রদত্ত","#6b7385","var(--ln)"];return slDue(r)<=0?["পরিশোধিত","#16a34a","#dcfce7"]:r.paid>0?["আংশিক","#b45309","#fef3c7"]:["বকেয়া","#e11d48","#ffe4e9"]}

 else tab=S.sal.slice().sort((a,b)=>(b.ym+(b.pdate||""))>(a.ym+(a.pdate||""))?1:-1).map(r=>{const p=pOf(r.pid);if(!p)return "";const a=slStat(r.type=="adv"?{base:0,paid:1}:r);return `<div class="card" style="padding:12px"><div class="ch" style="margin:0"><div><b>${esc(p.name)}</b><small style="display:block;color:var(--mu)">${p.kind} • ${esc(p.desig||"")}</small></div><b style="font-size:17px">${money(r.type=="adv"?r.paid:r.base)}</b></div><div style="margin:6px 0"><span class="pl b" style="margin:0">${r.type=="adv"?"অগ্রিম":"মাসিক বেতন"}</span> ${r.type=="adv"?"":slChip(r)} <small style="color:var(--mu)">${MN[+r.ym.slice(5)-1]} ${bn(r.ym.slice(0,4))}</small><span style="float:right"><span onclick="slEdit('${r.id}')" style="padding:4px 8px">✏️</span><span onclick="slDel('${r.id}')" style="padding:4px 8px;color:var(--rd)">🗑</span></span></div><div style="font-size:12px;line-height:1.8;color:var(--mu)">${r.type=="adv"?"":`<div style="display:flex;justify-content:space-between"><span>মূল মাসিক বেতন</span><b style="color:var(--tx)">${money(r.base)}</b></div>`}<div style="display:flex;justify-content:space-between"><span>${r.type=="adv"?"অগ্রিমের পরিমাণ":"এই লেনদেনে আদায়"}</span><b style="color:var(--gr)">${money(r.paid)}</b></div><div style="display:flex;justify-content:space-between"><span>আদায়ের তারিখ</span><b style="color:var(--tx)">${r.pdate?bn(r.pdate):"—"}</b></div>${r.type=="adv"?"":`<div style="display:flex;justify-content:space-between"><span>মূল বেতন থেকে বকেয়া</span><b style="color:var(--rd)">${money(Math.max(0,slDue(r)))}</b></div>`}</div></div>`}).join("")||'<div class="em">কোনো লেনদেন নেই</div>';

 return h;

  ${x.phone?`<textarea id="smx" rows="3" placeholder="বার্তা লিখুন"></textarea><div class="g2" style="margin:0"><button class="btn g" onclick="smDirect('wa')">WhatsApp</button><button class="btn o" onclick="smDirect('sms')">SMS</button></div>`:'<div class="hint">এই শিক্ষার্থীর অভিভাবকের ফোন নম্বর নেই।</div>'}</div>`}
 return `<input id="smq" placeholder="🔍 শিক্ষার্থী খুঁজুন..." value="${esc(smQ)}" oninput="smQ=this.value;smLst()"><div class="card" style="padding:0;margin-top:8px" id="sml">${smLstH()}</div>`;

function smLog(){return `<input id="lgq" placeholder="🔍 নাম বা ফোন নম্বর খুঁজুন..." value="${esc(lgQ)}" oninput="lgQ=this.value;lgLst()"><div class="card ov" style="padding:0;margin-top:8px" id="lgl">${lgH()}</div>`}
function lgH(){const k=lgQ.trim().toLowerCase();const r=S.smslog.map(l=>({l,x:pOf(l.sid)||{}})).filter(o=>!k||[o.x.guardian,o.x.name,o.x.phone].join(" ").toLowerCase().includes(k));
 return r.length?`<table class="sx-tb" style="min-width:560px;width:100%;border-collapse:collapse"><tr><th>অভিভাবক</th><th>শিক্ষার্থী</th><th>ফোন</th><th>ধরন</th><th>মাধ্যম</th><th>বার্তা</th></tr>${r.map(o=>{const t=smTy(o.l);return `<tr><td><b style="font-weight:500">${esc(o.x.guardian||"—")}</b></td><td>${esc(o.x.name||"—")}</td><td>${esc(o.x.phone||"")}</td><td><span class="sx-tp" style="${smTyC[t]||smTyC["বার্তা"]}">${t}</span></td><td><span class="sx-tp" style="${o.l.ch=="wa"?"border:1px solid #86efac;color:#15803d":"border:1px solid #86efac;color:#15803d"}">${o.l.ch=="wa"?"WhatsApp":"SMS"}</span></td><td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((o.l.tx||"").replace(/\n/g," "))}</td></tr>`}).join("")}</table>`:'<div class="em">কোনো লগ নেই</div>'}
function lgLst(){const e=$("lgl");if(e)e.innerHTML=lgH()}

async function exp(){
 S.set.lastBk=Date.now();save();const data=JSON.stringify(S),name="madrasa-backup-"+today()+".json",P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.Filesystem&&P.Share){

 }
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();if(!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()))return}catch(e){}
 modal(`<h2 style="margin-bottom:10px">ব্যাকআপ টেক্সট</h2><p style="font-size:13px;color:var(--mu);margin-bottom:8px">সব কপি করে কোথাও সেভ রাখুন (নোটস/WhatsApp)।</p><textarea id="bk" rows="8" readonly>${esc(data)}</textarea><button class="btn" style="width:100%" onclick="$('bk').select();document.execCommand('copy');alert('কপি হয়েছে')">কপি করুন</button><button class="btn o" style="width:100%;margin-top:8px" onclick="pasteImp()">পেস্ট করে রিস্টোর</button>`);
}
async function pickRestore(){
 const P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.FilePicker){
  try{
   const r=await P.FilePicker.pickFiles({limit:1,readData:true});
   const f=r.files&&r.files[0];if(!f)return;
   const txt=decodeURIComponent(escape(atob(f.data)));
   const d=JSON.parse(txt);if(!d.students)throw 0;
   S={...D(),...d};migrateExams();save();render();alert("রিস্টোর সম্পন্ন");return;
  }catch(e){if(e&&/cancel/i.test(e.message||""))return;alert("ফাইলটি পড়া যায়নি বা সঠিক ব্যাকআপ নয়। টেক্সট পেস্ট করে রিস্টোর করুন।");return}
 }
 $("rf").click();
}

function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.students)throw 0;S={...D(),...d};migrateExams();save();render();alert("রিস্টোর সম্পন্ন")}catch(e){alert("ফাইলটি সঠিক ব্যাকআপ নয়")}};r.readAsText(f)}

function modal(h){closeM();const m=document.createElement("div");m.className="mt";m.id="mt";m.onclick=e=>{if(e.target==m)closeM()};m.innerHTML="<div>"+h+"</div>";document.body.appendChild(m)}

migrateExams();autoFees();save();applyTheme();render();lockCheck();setInterval(()=>{if(S.set.theme=="auto")applyTheme()},60000);
