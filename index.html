  if(jwt)headers.Authorization="Bearer "+jwt;else if(key)headers["x-api-key"]=key;
  const r=await fetch(S.sync.apiUrl,{method:"POST",headers,body:JSON.stringify(payload),cache:"no-store"});
  if(!r.ok){if(r.status===401){sessionStorage.removeItem("smartEduJwt");throw Error("JWT expired বা login প্রয়োজন")}throw Error("HTTP "+r.status)}
  const out=await r.json();

   const localSync={...S.sync,backoffMs:0,nextRetryAt:0};
   S={...D(),...out.data};S.sync={...S.sync,...localSync,apiKey:localSync.apiKey,apiUrl:localSync.apiUrl,deviceId:localSync.deviceId};

 }catch(e){
  const old=Number(S.sync.backoffMs||1000),next=Math.min(Math.max(old*2,1000),300000);
  S.sync.backoffMs=next;S.sync.nextRetryAt=Date.now()+next;
  localStorage.setItem(KEY,JSON.stringify(S));

async function emailLogin(){
  if(!sb) return lerr("Supabase সংযোগ তৈরি হয়নি।");

  const email=($("emEmail").value||"").trim().toLowerCase();
  const pw=$("emPass").value||"";

  if(!email||!pw) return lerr("ইমেইল ও পাসওয়ার্ড দিন");
  lerr("অপেক্ষা করুন...");

  try{
    const {data:authData,error}=await sb.auth.signInWithPassword({
      email,
      password:pw
    });
    if(error) throw error;

    const authUser=authData.user;
    if(!authUser){
      await sb.auth.signOut();
      return lerr("ব্যবহারকারীর তথ্য পাওয়া যায়নি।");
    }

    applySessionSchool("");
    let sidSel="";
    let u;

    if(SUPER_ADMIN_EMAILS.includes(email)){
      u=S.users.find(
        x=>String(x.identifier).toLowerCase()===email
      );

      if(!u){
        u={
          id:uid(),
          identifier:email,
          pin:uid()+uid(),
          role:"admin",
          active:true,
          permissions:[],
          createdAt:Date.now()
        };
        S.users.push(u);
      }else{
        u.role="admin";
        u.active=true;
      }

      save();
    }else{
      const {data:access,error:accessError}=await sb
        .from("smartedu_user_access")
        .select("status,roles,school_id,perms")
        .eq("user_id",authUser.id)
        .maybeSingle();

      if(accessError){
        await sb.auth.signOut();
        return lerr("অনুমোদন যাচাই করা যায়নি। আবার চেষ্টা করুন।");
      }

      if(!access || access.status!=="approved"){
        await sb.auth.signOut();
        return lerr(
          access?.status==="blocked"
            ? "আপনার অ্যাকাউন্ট ব্লক করা হয়েছে।"
            : "আপনার অ্যাকাউন্ট Super Admin-এর অনুমোদনের অপেক্ষায় আছে।"
        );
      }

      const tsid=access.school_id||"main";
      if(tsid!==ACT_SID){
        localStorage.setItem("smartEduPending",JSON.stringify({identifier:email,role:(access.roles||[]).includes(UROLES[0])?"admin":"teacher",permissions:permsFromAccess(access),sid:tsid}));
        localStorage.setItem("smartEduActiveSid",tsid);
        location.reload();
        return;
      }

      if(email===ADMIN_AUTH_EMAIL.trim().toLowerCase()){
        u=S.users.find(
          x=>x.role==="admin" && x.active!==false
        );

        if(!u){
          await sb.auth.signOut();
          return lerr("বিদ্যমান অ্যাডমিন অ্যাকাউন্ট পাওয়া যায়নি।");
        }
      }else{
        u=S.users.find(
          x=>String(x.identifier).toLowerCase()===email
        );

        if(!u){
          u={
            id:uid(),
            identifier:email,
            pin:uid()+uid(),
            role:((access.roles||[]).includes(UROLES[0])?"admin":"teacher"),
            active:true,
            permissions:[],
            createdAt:Date.now()
          };
          S.users.push(u);
          save();
        }

        const wantRole=(access.roles||[]).includes(UROLES[0])?"admin":"teacher";
        if(u.role!==wantRole){u.role=wantRole;save();}
        const pmx=(access.perms&&Object.keys(access.perms).length)?access.perms:pmDefault(access.roles);
        u.permissions=[...new Set(["dashboard"].concat(PMK.filter(k=>pmx[k]).map(k=>PM_TO_PERM[k]).filter(Boolean)))];
        save();
        applySessionSchool(access.school_id);sidSel=access.school_id||"";

        if(u.active===false){
          await sb.auth.signOut();
          return lerr("এই অ্যাকাউন্টটি নিষ্ক্রিয়।");
        }
      }
    }

    activeUser={
      id:u.id,
      identifier:u.identifier,
      role:u.role
    };

    sessionStorage.setItem(
      "smartEduUser",
      JSON.stringify(activeUser)
    );
    localStorage.setItem("smartEduRemember",JSON.stringify({id:u.id,identifier:u.identifier,role:u.role,sid:sidSel}));

    unlocked=true;
    render();

  }catch(e){
    lerr("লগইন ব্যর্থ: "+e.message);
  }
}

async function loadApprovalPanel(){
  if(!isSuper()){
    alert("শুধু Super Admin এই কাজ করতে পারবেন।");
    return;
  }
  try{
    const {data:users,error}=await sb.rpc("smartedu_list_user_access");
    if(error) throw error;

    const order={pending:0,approved:1,blocked:2};
    const list=(users||[]).slice().sort(
      (a,b)=>(order[a.status]??3)-(order[b.status]??3)
    );
    window._apUsers=list;
    const names={pending:"অনুমোদনের অপেক্ষায়",approved:"অনুমোদিত",blocked:"ব্লক করা"};
    const cnt=k=>list.filter(u=>u.status===k).length;

    const rows=list.map(u=>{
      const isSup=SUPER_ADMIN_EMAILS.includes(String(u.email||"").toLowerCase());
      const sch=schAll().find(x=>String(x.id)===String(u.school_id));
      const roleTxt=isSup?"Super Admin":((u.roles&&u.roles.length)?u.roles.join(", "):"ভূমিকা নির্ধারণ হয়নি");
      const info=u.status==="approved"?" · "+roleTxt+(sch?" · 🏛 "+sch.name:""):"";
      const ok=`<button class="btn g s" onclick="changeApprovalStatus('${u.user_id}','approved')">অনুমোদন</button>`;
      const no=`<button class="btn r s" onclick="changeApprovalStatus('${u.user_id}','blocked')">ব্লক</button>`;
      const rl=`<button class="ob s" onclick="userRoleForm('${u.user_id}')">🔖 ভূমিকা</button>`;
      const buttons=isSup?"":(u.status==="pending"?ok+no:(u.status==="approved"?rl+no:ok));
      return `<div class="row">
        <div class="f">
          <b>${esc(u.email||"ইমেইল নেই")}</b>
          <small>${esc(names[u.status]||u.status)}${esc(info)}</small>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">${buttons}</div>
      </div>`;
    }).join("");

    modal(`<div class="card">
      <div class="ch">
        <h2>ইমেইল ব্যবহারকারী</h2>
        <button class="ob s" onclick="closeM()">বন্ধ</button>
      </div>
      <small>অপেক্ষায়: ${cnt("pending")} · অনুমোদিত: ${cnt("approved")} · ব্লক: ${cnt("blocked")}</small>
      ${rows||'<div class="em">কোনো ব্যবহারকারী নেই</div>'}
    </div>`);
  }catch(e){
    alert("ব্যবহারকারীর তালিকা আনা যায়নি: "+e.message);
  }
}

async function changeApprovalStatus(userId,status){
  if(!isSuper()){
    alert("শুধু Super Admin এই কাজ করতে পারবেন।");
    return;
  }

  if(!["approved","blocked"].includes(status)) return;

  if(!confirm(
    status==="approved"
      ? "এই ব্যবহারকারীকে অনুমোদন করবেন?"
      : "এই ব্যবহারকারীকে ব্লক করবেন?"
  )) return;

  try{
    const {data,error}=await sb.rpc(
      "smartedu_set_user_status",
      {
        target_user_id:userId,
        new_status:status
      }
    );

    if(error) throw error;

    if(data!==true){
      alert("ব্যবহারকারীর অবস্থা পরিবর্তন করা যায়নি।");
      return;
    }

    alert(
      status==="approved"
        ? "ব্যবহারকারী অনুমোদিত হয়েছেন।"
        : "ব্যবহারকারী ব্লক হয়েছেন।"
    );

    await loadApprovalPanel();

  }catch(e){
    alert("পরিবর্তন ব্যর্থ: "+e.message);
  }
}

function csvParse(text){
 const rows=[],row=[];let cell="",quoted=false;
 text=String(text||"").replace(/^\uFEFF/,"");
 for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(ch==='"'){if(quoted&&nx==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=""}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&nx==='\n')i++;row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row.slice());row.length=0;cell=""}else cell+=ch}
 if(cell.length||row.length){row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row)}
 if(!rows.length)return [];
 const keys=rows.shift().map(csvField),out=[];
 rows.forEach(r=>{const o={};keys.forEach((k,i)=>{if(k)o[k]=String(r[i]??"").trim()});out.push(o)});return out;
}

   else if(o.monthlyFee!==undefined&&o.monthlyFee!==""&&(!Number.isFinite(+o.monthlyFee)||+o.monthlyFee<0))err="মাসিক ফি ভুল";
   const item={...o,name,cls,roll,gender,phone,status:o.status||"সক্রিয়",type:o.type||"অনাবাসিক",division:o.division||DIVS[0],admDate:o.admDate||today(),monthlyFee:+o.monthlyFee||0,addr:o.addr||""};
   if(err)errors.push({row:n,name:name||"—",error:err});else{seen.add(cls+"|"+roll);valid.push(item)}
  });

 }catch(e){alert("CSV পড়া যায়নি। প্রথম row-তে header দিন, যেমন: name, class, roll")}};r.readAsText(file,"UTF-8")

  if(!st)err="শিক্ষার্থী পাওয়া যায়নি (studentId বা name+class+roll দিন)";

  else if(marks!==""&&(!en||!sub||!Number.isFinite(+marks)||+marks<0||+marks>fm))err="exam/subject/marks/full marks ভুল";
  else if((marks!==""||en||sub)&&(!en||!sub))err="exam ও subject আবশ্যক";
  const sig=st?(st.id+"|"+ad+"|"+en+"|"+sub):"";if(!err&&sig&&seen.has(sig))err="একই row-এর duplicate";if(!err&&sig)seen.add(sig);
  if(err)bulkErrors.push({row,name:o.name||"—",error:err});else if(st)bulkValid.push({st,ad,av,en,sub,marks,fm,pm});
 });bulkImportPreview(true)
}

/* ---- QR (byte mode, ECC M, v1-10) ---- */
function qrSvg(text,px){
 const enc=new TextEncoder().encode(text),ECC=[10,16,26,18,24,16,18,22,22,26],NB=[1,1,1,2,2,4,4,4,5,5];
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
 let v=1;for(;v<=10;v++){if(4+(v<10?8:16)+enc.length*8<=(Math.floor(raw(v)/8)-ECC[v-1]*NB[v-1])*8)break}
 if(v>10)return "";
 const nb=NB[v-1],el=ECC[v-1],rc=Math.floor(raw(v)/8),cap=rc-el*nb,bits=[],put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1)};
 put(4,4);put(enc.length,v<10?8:16);enc.forEach(b=>put(b,8));
 for(let i=0;i<4&&bits.length<cap*8;i++)bits.push(0);while(bits.length%8)bits.push(0);
 for(let pd=0xEC;bits.length<cap*8;pd^=0xEC^0x11)put(pd,8);
 const dat=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];dat.push(b)}
 const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
 const div=Array(el-1).fill(0).concat([1]);let root=1;
 for(let i=0;i<el;i++){for(let j=0;j<el;j++){div[j]=mul(div[j],root);if(j+1<el)div[j]^=div[j+1]}root=mul(root,2)}
 const rem=d=>{const r=Array(el).fill(0);for(const b of d){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
 const sl=Math.floor(rc/nb),ns=nb-rc%nb,blocks=[];let k=0;
 for(let i=0;i<nb;i++){const d=dat.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const e=rem(d);if(i<ns)d.push(0);blocks.push(d.concat(e))}
 const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-el||j>=ns)all.push(b[i])});
 const size=v*4+17,m=Array.from({length:size},()=>Array(size).fill(false)),f=Array.from({length:size},()=>Array(size).fill(false));
 const setF=(x,y,d)=>{m[y][x]=d;f[y][x]=true};
 for(let i=0;i<size;i++){setF(6,i,i%2==0);setF(i,6,i%2==0)}
 const fin=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)setF(x,y,d!=2&&d!=4)}};
 fin(3,3);fin(size-4,3);fin(3,size-4);
 const na=v>1?Math.floor(v/7)+2:0,step=Math.ceil((v*4+4)/(Math.max(na,2)*2-2))*2;let ap=v>1?[6]:[];for(let q=size-7;ap.length<na;q-=step)ap.splice(1,0,q);
 for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i==0&&j==0)||(i==0&&j==na-1)||(i==na-1&&j==0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}
 const bit=(x,i)=>((x>>>i)&1)!=0;
 const fmt=mk=>{const d=0<<3|mk;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412;
  for(let i=0;i<=5;i++)setF(8,i,bit(b,i));setF(8,7,bit(b,6));setF(8,8,bit(b,7));setF(7,8,bit(b,8));for(let i=9;i<15;i++)setF(14-i,8,bit(b,i));
  for(let i=0;i<8;i++)setF(size-1-i,8,bit(b,i));for(let i=8;i<15;i++)setF(8,size-15+i,bit(b,i));setF(8,size-8,true)};
 fmt(0);
 if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const c=bit(b,i),a=size-11+i%3,d=Math.floor(i/3);setF(a,d,c);setF(d,a,c)}}

 const MK=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
 const pen=g=>{let p=0;for(let a=0;a<size;a++)for(const dr of [0,1]){let run=1;for(let b=1;b<size;b++){const c=dr?g[b][a]:g[a][b],pr=dr?g[b-1][a]:g[a][b-1];if(c==pr){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}return p};
 let best=null,bm=0,bp=1e9;
 for(let mk=0;mk<8;mk++){const g=m.map(r=>r.slice());for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!f[y][x]&&MK[mk](x,y))g[y][x]=!g[y][x];const pp=pen(g);if(pp<bp){bp=pp;best=g;bm=mk}}
 for(let y=0;y<size;y++)for(let x=0;x<size;x++)m[y][x]=best[y][x];
 fmt(bm);
 let d="";for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(m[y][x])d+=`M${x} ${y}h1v1h-1z`;

}

 const hist=fs.slice().sort((a,b)=>(b.date||"")>(a.date||"")?1:-1),pages=Math.max(1,Math.ceil(hist.length/5));if(txP>pages)txP=pages;if(txP<1)txP=1;

 return `<div class="card" style="padding:10px"><div class="ch"><b>👛 একাডেমিক লেনদেন</b><select style="width:90px;margin:0" onchange="txY=+this.value;txP=1;${rf}">${[Y-2,Y-1,Y,Y+1].map(y=>`<option value="${y}" ${txY==y?"selected":""}>${bn(y)}</option>`).join("")}</select></div>

 modal(HND+`<h2 style="font-size:16px;margin-bottom:8px">💬 ${one?esc(l[0].guardian||l[0].name)+" -কে বার্তা পাঠান":"অভিভাবকদের বার্তা পাঠান"}</h2><label class="lb">বার্তার বিষয়বস্তু</label><textarea rows="5" oninput="mctx.txt=this.value;$('mc').textContent=bn(this.value.length)+' অক্ষর'">${esc(mctx.txt)}</textarea><small id="mc" style="color:var(--mu)">${bn(mctx.txt.length)} অক্ষর</small>

 <div class="card" style="padding:6px">${l.map(x=>`<div class="row"><input type="checkbox" class="cb" ${mctx.sel[x.id]?"checked":""} onchange="msgTog('${x.id}')"><div class="f"><b>${esc(x.guardian||x.name)}</b>${x.guardian?` <span style="font-size:12px;color:var(--mu)">(${esc(x.name)})</span>`:""}<small>📞 ${esc(x.phone)}${mctx.done[x.id]?" ✓ পাঠানো হয়েছে":""}</small></div><button class="btn s g" onclick="msgOne('${x.id}','wa')">WA</button><button class="btn s o" onclick="msgOne('${x.id}','sms')">SMS</button></div>`).join("")}</div>
 <p style="font-size:11px;color:var(--mu);text-align:center">WhatsApp/SMS বাটনে ক্লিক করলে ফোনের অ্যাপ খুলবে — পাঠানোর পর লগ স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে। "সকলকে WhatsApp" চাপলে একে একে পরের জনের চ্যাট খুলবে। {নাম} ও {শ্রেণি} লিখলে প্রত্যেকের নাম বসবে।</p>`);
 $("mt").onclick=null;
}

const sch=()=>`<h2 style="text-align:center;color:#1d4ed8;margin:6px 0">${esc(S.school.name)}</h2>`;

/* ---- hub ---- */
function clsHub(){
 const T=today(),it=[["rt","📅","সাপ্তাহিক ক্লাস রুটিন","প্রতিটি শ্রেণীর জন্য দিন ও পিরিয়ড টাইমটেবিল",bn(S.routine.length)+" টি রুটিন"],["ev","🎉","ইভেন্ট ক্যালেন্ডার","ইভেন্ট, পরীক্ষা ও ছুটির ক্যালেন্ডার",bn(S.events.length)+" টি ইভেন্ট"],["hw","📝","পড়া ও বাড়ির কাজ","দৈনিক পড়া ও বাড়ির কাজ আপডেট করুন",bn(S.hw.filter(h=>h.date==T).length)+" টি আজকের"],["bk","📚","শ্রেণী ও পাঠ্যবই","শ্রেণিভিত্তিক পাঠ্যবইয়ের তালিকা",bn(S.tbooks.length)+" টি বই"]];
 return phdr("শ্রেণী ও পাঠ্য","ক্লাস রুটিন, ইভেন্ট, পড়া ও পাঠ্যবই এক জায়গায়")+`<div style="margin-top:12px">${it.map(x=>`<div class="hb" onclick="sub='${x[0]}';render()"><div class="ic2">${x[1]}</div><div class="f"><b>${x[2]}</b><small style="color:var(--mu);font-size:12px">${x[3]}</small></div><span class="pl b">${x[4]}</span></div>`).join("")}</div>`;
}

/* ---- weekly routine ---- */
const DAYS=["শনিবার","রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার"],DSH=["শনি","রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র"];
let rtE=null;
const tm=m=>p2(Math.floor(m/60))+":"+p2(m%60);
function rtDefault(c){return {cls:c,periods:6,days:[0,1,2,3,4,5],times:Array.from({length:10},(_,i)=>({s:tm(480+i*45),e:tm(480+i*45+40)})),cells:{}}}
function rtOpen(c){const ex=S.routine.find(r=>r.cls==c);rtE=ex?JSON.parse(JSON.stringify(ex)):rtDefault(c);const d=rtDefault(c);while(rtE.times.length<10)rtE.times.push(d.times[rtE.times.length]);render()}
function rtNew(){const cl=allCls();if(!cl.length){alert("আগে শিক্ষার্থী যোগ করুন");return}rtOpen(cl.find(c=>!S.routine.some(r=>r.cls==c))||cl[0])}
const rtFilled=r=>Object.keys(r.cells).filter(k=>{const a=k.split("|");return r.days.includes(+a[0])&&+a[1]<=r.periods&&r.cells[k].s}).length;
function rt(){
 return phdr("সাপ্তাহিক ক্লাস রুটিন","প্রতিটি শ্রেণীর জন্য দিন ও পিরিয়ড টাইমটেবিল তৈরি করুন")+(rtE?rtEditor():`<button class="btn" style="margin:12px 0" onclick="rtNew()">✎ নতুন / সম্পাদনা</button>`+(S.routine.map(r=>`<div class="hb"><div class="ic2">📅</div><div class="f"><b>${esc(r.cls)}</b><div style="margin-top:4px"><span class="pl b">${bn(r.periods)} পিরিয়ড</span><span class="pl g">${bn(r.days.length)} দিন</span><span class="pl">${bn(rtFilled(r))} টি</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="ob" style="padding:6px 10px" onclick="rtPdf('${esc(r.cls)}')">🗎 PDF</button><button class="ob" style="padding:6px 10px" onclick="rtOpen('${esc(r.cls)}')">✎ সম্পাদনা</button></div></div>`).join("")||'<div class="em">কোনো রুটিন নেই। "নতুন / সম্পাদনা" চাপুন।</div>'));
}
function rtEditor(){
 const e=rtE,tn=S.teachers.map(t=>t.name);
 const cell=(d,p)=>{const c=e.cells[d+"|"+p]||{};return `<td style="min-width:108px;vertical-align:top"><input value="${esc(c.s)}" placeholder="বিষয়" oninput="rtC(${d},${p},'s',this.value)" style="margin:0 0 4px;padding:6px;font-size:12px"><select onchange="rtC(${d},${p},'t',this.value)" style="margin:0;padding:5px;font-size:11px"><option value="">শিক্ষক</option>${tn.map(n=>`<option ${c.t==n?"selected":""}>${esc(n)}</option>`).join("")}</select></td>`};
 return `<div class="top" style="margin:12px 0"><button class="ob" onclick="rtE=null;render()">≡ তালিকা</button><button class="ob" onclick="rtPdf(rtE.cls)">🗎 PDF ডাউনলোড</button></div>
 <div class="card">${fsel("শ্রেণী","rt_c",allCls(),e.cls,1).replace("<select ",'<select onchange="rtOpen(this.value)" ')}${fi("পিরিয়ড সংখ্যা","rt_p",e.periods,"number",1,"","min=1 max=10 onchange=\"rtP(this.value)\"")}<div class="hint">প্রতিদিনের পিরিয়ড (১–১০) ও ক্লাসের দিন বেছে নিন।</div><label class="lb">ক্লাসের দিন</label><div style="display:flex;gap:6px;flex-wrap:wrap">${DSH.map((d,i)=>`<button class="chip ${e.days.includes(i)?"on":""}" onclick="rtDay(${i})">${d}</button>`).join("")}</div></div>
 <div class="card ov" style="padding:6px"><table class="tb rtt"><tr><th>পিরিয়ড</th>${e.days.map(d=>`<th>${DSH[d]}</th>`).join("")}</tr>${Array.from({length:e.periods},(_,i)=>`<tr><td style="width:96px;min-width:96px;vertical-align:top"><b>${bn(i+1)}</b><input type="time" value="${e.times[i].s}" onchange="rtT(${i},'s',this.value)" style="display:block;width:90px;margin:2px 0;padding:3px;font-size:10px"><input type="time" value="${e.times[i].e}" onchange="rtT(${i},'e',this.value)" style="display:block;width:90px;margin:0;padding:3px;font-size:10px"></td>${e.days.map(d=>cell(d,i+1)).join("")}</tr>`).join("")}</table></div>
 <button class="btn" style="width:100%" onclick="rtSave()">সংরক্ষণ করুন</button><div class="g2" style="margin:8px 0 0"><button class="btn o" onclick="rtE=null;render()">বাতিল</button><button class="btn r" onclick="rtDel(rtE.cls)">মুছে ফেলুন</button></div>`;
}
function rtC(d,p,k,v){const key=d+"|"+p;(rtE.cells[key]=rtE.cells[key]||{})[k]=v}
function rtT(i,k,v){rtE.times[i][k]=v}
function rtP(v){rtE.periods=Math.max(1,Math.min(10,+v||1));render()}
function rtDay(i){const d=rtE.days;if(d.includes(i)){if(d.length>1)rtE.days=d.filter(x=>x!=i)}else{d.push(i);d.sort((a,b)=>a-b)}render()}
function rtSave(){const e=rtE,i=S.routine.findIndex(r=>r.cls==e.cls),o={...e,times:e.times.slice(0,10)};if(i>=0)S.routine[i]=o;else S.routine.push(o);logA("add","ক্লাস রুটিন",e.cls+" শ্রেণীর রুটিন সংরক্ষিত");save();rtE=null;render()}
function rtDel(c){if(!confirm(c+" শ্রেণীর রুটিন মুছবেন?"))return;S.routine=S.routine.filter(r=>r.cls!=c);save();rtE=null;render()}
function rtPdf(c){
 const r=(rtE&&rtE.cls==c)?rtE:S.routine.find(x=>x.cls==c);if(!r){alert("রুটিন পাওয়া যায়নি");return}
 printDoc("class-routine",sch()+`<div style="text-align:center;margin-bottom:10px">সাপ্তাহিক ক্লাস রুটিন — শ্রেণি: <b>${esc(c)}</b></div><table class="ptb" style="border:1px solid #1d4ed8"><tr><th style="background:#2563eb;color:#fff">পিরিয়ড</th>${r.days.map(d=>`<th style="background:#2563eb;color:#fff">${DAYS[d]}</th>`).join("")}</tr>${Array.from({length:r.periods},(_,i)=>`<tr><td><b>${bn(i+1)}</b><br><small>${bn(r.times[i].s)} - ${bn(r.times[i].e)}</small></td>${r.days.map(d=>{const c2=r.cells[d+"|"+(i+1)]||{};return `<td>${esc(c2.s||"")}${c2.t?`<br><small style="color:#555">${esc(c2.t)}</small>`:""}</td>`}).join("")}</tr>`).join("")}</table><style>.ptb td,.ptb th{border:1px solid #c7d2fe;font-size:12px;padding:6px 7px}</style>`);
}

/* ---- events ---- */
const EVT={"ইভেন্ট":"#ec4899","ছুটি":"#ef4444","পরীক্ষা":"#10b981","সভা":"#f59e0b","অন্যান্য":"#8b5cf6"},EVI={"ইভেন্ট":"🎉","ছুটি":"🏖","পরীক্ষা":"📝","সভা":"👥","অন্যান্য":"📌"};
let evView="cal",evM=new Date().getMonth(),evY=new Date().getFullYear(),evSel=today();
const evAll=()=>S.events.concat(S.exams.filter(x=>x.date).map(x=>({id:"x"+x.id,name:x.name+" — "+(x.subject||"")+" ("+x.cls+")",type:"পরীক্ষা",start:x.date,end:x.date,auto:1})));
const evOn=d=>evAll().filter(e=>e.start<=d&&d<=(e.end||e.start));
function evCard(e){return `<div class="card" style="border-left:4px solid ${EVT[e.type]||"#8b5cf6"};padding:10px;margin-bottom:8px"><div class="ch" style="margin:0"><b>${esc(e.name)}</b>${e.auto?"":`<span onclick="evForm('${e.id}')" style="padding:0 6px">✏️</span>`}</div><span class="pl" style="background:${EVT[e.type]||"#8b5cf6"}22;color:${EVT[e.type]||"#8b5cf6"}">${EVI[e.type]||""} ${esc(e.type)}</span><div style="font-size:12px;color:var(--mu)">📅 ${bn(e.start)}${e.end&&e.end!=e.start?" — "+bn(e.end):""}${e.place?" · 📍 "+esc(e.place):""}</div>${e.desc?`<div style="font-size:12px;margin-top:4px">${esc(e.desc)}</div>`:""}</div>`}
function ev(){
 const all=evAll(),mo=mk(evY,evM),first=(new Date(evY,evM,1).getDay()+1)%7,dim=new Date(evY,evM+1,0).getDate(),T=today();
 const cells=Array.from({length:first},()=>"<div></div>").concat(Array.from({length:dim},(_,i)=>{const d=mo+"-"+p2(i+1),es=evOn(d);return `<div class="cd ${d==evSel?"sel":""} ${d==T?"td":""}" onclick="evSel='${d}';render()"><span>${bn(i+1)}</span><div>${es.slice(0,3).map(e=>`<i style="background:${EVT[e.type]||"#8b5cf6"}"></i>`).join("")}</div></div>`}));
 const lst=all.slice().sort((a,b)=>a.start>b.start?1:-1);
 return phdr("ইভেন্ট ও ছুটির ক্যালেন্ডার","ইভেন্ট, পরীক্ষা ও ছুটির তালিকা")+`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" style="background:#f97316" onclick="evForm()">＋ নতুন ইভেন্ট</button><button class="ob" onclick="evPdf()">🗎 PDF</button></div>
 <div class="g2">${["ইভেন্ট","ছুটি","পরীক্ষা","সভা"].map(t=>`<div class="sc" style="background:${EVT[t]}22"><i style="color:${EVT[t]}">${EVI[t]}</i><div><b style="color:${EVT[t]}">${bn(all.filter(e=>e.type==t).length)}</b><small>${t}</small></div></div>`).join("")}</div>
 <div class="seg" style="width:70%">${[["cal","ক্যালেন্ডার"],["list","তালিকা"]].map(v=>`<button class="${evView==v[0]?"on":""}" style="${evView==v[0]?"color:#f97316":""}" onclick="evView='${v[0]}';render()">${v[1]}</button>`).join("")}</div>`
 +(evView=="cal"?`<div class="card" style="padding:10px"><div class="ch"><button class="ob" style="padding:4px 12px" onclick="evMv(-1)">‹</button><b>${MN[evM]} ${bn(evY)}</b><button class="ob" style="padding:4px 12px" onclick="evMv(1)">›</button></div><div class="cal">${DSH.map(d=>`<div class="wd">${d}</div>`).join("")}${cells.join("")}</div></div><b style="font-size:14px">${bn(evSel)} তারিখের ইভেন্ট</b><div style="margin-top:8px">${evOn(evSel).map(evCard).join("")||'<div class="em">এই দিনে কোনো ইভেন্ট নেই</div>'}</div>`:lst.map(evCard).join("")||'<div class="em">কোনো ইভেন্ট নেই</div>');
}
function evMv(n){evM+=n;if(evM<0){evM=11;evY--}if(evM>11){evM=0;evY++}render()}
function evForm(id){if(!allow("classes"))return;
 const e=S.events.find(x=>x.id==id)||{type:"ইভেন্ট",start:evSel||today()};
 modal(HND+`<h2 style="text-align:center;font-size:16px;margin-bottom:6px">${id?"ইভেন্ট সম্পাদনা":"নতুন ইভেন্ট যোগ"}</h2>${fi("ইভেন্টের নাম","ev_n",e.name,"text",1,"ইভেন্টের নাম লিখুন")}<div class="g2" style="margin:0"><div>${fsel("ধরন","ev_t",Object.keys(EVT),e.type,1)}</div><div>${fi("স্থান","ev_p",e.place,"text",0,"স্থান")}</div><div>${fi("তারিখ","ev_s",e.start,"date",1)}</div><div>${fi("শেষ তারিখ","ev_e",e.end,"date")}</div></div><label class="lb">বিবরণ</label><textarea id="ev_d" rows="3" placeholder="বিবরণ">${esc(e.desc)}</textarea>${fi("মন্তব্য","ev_o",e.note,"text",0,"অতিরিক্ত তথ্য (ঐচ্ছিক)")}
 <div class="bt"><button class="btn o" onclick="closeM()">বাতিল</button><button class="btn" onclick="evSave('${id||""}')">সংরক্ষণ</button></div>${id?`<button class="btn r" style="width:100%;margin-top:8px" onclick="evDel('${id}')">মুছে ফেলুন</button>`:""}`);$("mt").onclick=null;
}
function evSave(id){
 const o={name:gv("ev_n"),type:gv("ev_t"),place:gv("ev_p"),start:gv("ev_s"),end:gv("ev_e"),desc:gv("ev_d"),note:gv("ev_o")};
 if(!o.name||!o.start){alert("ইভেন্টের নাম ও তারিখ দিন");return}
 if(o.end&&o.end<o.start){alert("শেষ তারিখ শুরুর আগে হতে পারে না");return}
 if(id)Object.assign(S.events.find(x=>x.id==id),o);else S.events.push({id:uid(),...o});
 logA(id?"edit":"add","ইভেন্ট",(id?"ইভেন্ট আপডেট: ":"নতুন ইভেন্ট: ")+o.name);save();closeM();render();
}
function evDel(id){if(!confirm("ইভেন্টটি মুছবেন?"))return;S.events=S.events.filter(x=>x.id!=id);save();closeM();render()}
function evPdf(){
 const mo=mk(evY,evM),l=evAll().filter(e=>e.start.slice(0,7)<=mo&&(e.end||e.start).slice(0,7)>=mo).sort((a,b)=>a.start>b.start?1:-1);
 printDoc("events",sch()+`<style>.ptb td,.ptb th{border:1px solid #c7d2fe;font-size:12px;padding:6px 7px}</style><div style="text-align:center;margin-bottom:10px">ইভেন্ট ও ছুটির ক্যালেন্ডার — ${MN[evM]} ${bn(evY)}</div><table class="ptb" style="border:1px solid #1d4ed8"><tr><th>তারিখ</th><th>ইভেন্ট</th><th>ধরন</th><th>স্থান</th><th>বিবরণ</th></tr>${l.map(e=>`<tr><td>${bn(e.start)}${e.end&&e.end!=e.start?" — "+bn(e.end):""}</td><td>${esc(e.name)}</td><td>${esc(e.type)}</td><td>${esc(e.place||"")}</td><td>${esc(e.desc||"")}</td></tr>`).join("")||'<tr><td colspan="5">কোনো ইভেন্ট নেই</td></tr>'}</table>`);
}

/* ---- homework ---- */
let hwDate=today(),hwCls="",hwF=null;
const hwList=()=>S.hw.filter(h=>(!hwDate||h.date==hwDate)&&(!hwCls||h.cls==hwCls));
function hw(){
 const l=hwList();
 return phdr("আজকের পড়া ও বাড়ির কাজ","শ্রেণিভিত্তিক দৈনিক পড়া ও বাড়ির কাজ আপডেট করুন")+`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" onclick="hwForm()">＋ নতুন কাজ যোগ</button><button class="ob" onclick="hwPdf()">🗎 PDF</button></div>
 <div class="g2"><input type="date" value="${hwDate}" onchange="hwDate=this.value;render()" style="margin:0"><select onchange="hwCls=this.value;render()" style="margin:0"><option value="">সব শ্রেণী</option>${allCls().map(c=>`<option ${hwCls==c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`
 +(l.map(h=>`<div class="card"><div class="ch" style="margin:0"><div><b>${esc(h.subject)}</b> <span class="pl b">${esc(h.cls)}</span></div><span onclick="hwForm('${h.id}')" style="padding:0 6px">✏️</span></div>${h.title?`<div style="font-size:14px;margin-top:4px"><b>${esc(h.title)}</b></div>`:""}${h.lesson?`<div style="font-size:13px;margin-top:4px">📖 আজকের পড়া: ${esc(h.lesson)}</div>`:""}${(h.homework||h.text)?`<div style="font-size:13px;margin-top:4px">📝 বাড়ির কাজ: ${esc(h.homework||h.text)}</div>`:""}${h.teacher?`<small style="color:var(--mu)">👤 ${esc(h.teacher)}</small>`:""}</div>`).join("")||`<div class="card" style="text-align:center;padding:24px"><div style="font-size:34px;color:var(--mu)">📖</div><div style="color:var(--mu);margin:8px 0">আজকের পড়া এখনো আপডেট হয়নি</div><button class="btn s" onclick="hwForm()">＋ আপডেট করুন</button></div>`);
}
function hwForm(id){if(!allow("classes"))return;
 if(!allCls().length){alert("আগে শিক্ষার্থী যোগ করুন");return}
 const o=S.hw.find(x=>x.id==id);
 hwF=o?{id,date:o.date,cls:o.cls,teacher:o.teacher||"",blocks:[{subject:o.subject,title:o.title||"",lesson:o.lesson||"",homework:o.homework||o.text||""}]}:{id:null,date:hwDate||today(),cls:hwCls||allCls()[0],teacher:"",blocks:[{subject:"",title:"",lesson:"",homework:""}]};
 drawHw();
}
function hwGrab(){hwF.date=gv("hf_d");hwF.cls=gv("hf_c");hwF.teacher=gv("hf_t");hwF.blocks.forEach((b,i)=>{b.subject=gv("hb"+i+"s");b.title=gv("hb"+i+"t");b.lesson=gv("hb"+i+"l");b.homework=gv("hb"+i+"h")})}
function hwAddB(){hwGrab();hwF.blocks.push({subject:"",title:"",lesson:"",homework:""});drawHw()}
function hwRm(i){hwGrab();hwF.blocks.splice(i,1);drawHw()}

function repRows(){

function drawRc(){

function bmOpen(){bmCls=xCls||"";bmName="";drawBm()}

function drawBm(){
 const names=bmCls?exNames(bmCls):[],ps=bmCls&&bmName?bmPapers():[],l=bmCls?activeStu(bmCls):[];
 modal(HND+`<h2 style="text-align:center;font-size:16px">🗒 বাল্ক নম্বর এন্ট্রি</h2><div style="text-align:center;font-size:12px;color:var(--mu);margin-bottom:8px">একসাথে পুরো ক্লাসের সকল বিষয়ের নম্বর প্রবেশ করুন</div>
 <div class="g2" style="margin:0"><div>${fsel("শ্রেণি","bm_c",xClsList(),bmCls,1,"শ্রেণি বেছে নিন").replace("<select ",'<select onchange="bmCls=this.value;bmName=\'\';drawBm()" ')}</div><div>${fsel("পরীক্ষা","bm_n",names,bmName,1,"পরীক্ষা বেছে নিন").replace("<select ",`<select onchange="bmName=this.value;drawBm()" ${bmCls?"":"disabled"} `)}</div></div>`
 +(ps.length?`<div class="card ov" style="padding:0;margin-top:8px"><table class="tb" id="bmt"><tr><th>#</th><th>শিক্ষার্থী</th>${ps.map(p=>`<th>${esc(p.subject)}<br><small>/${bn(p.total||100)}</small></th>`).join("")}</tr>${l.map((x,i)=>`<tr><td>${bn(i+1)}</td><td><b>${esc(x.name)}</b></td>${ps.map(p=>{const v=p.marks&&p.marks[x.id]!==undefined?p.marks[x.id]:"";return `<td style="text-align:center"><input id="bm_${p.id}_${x.id}" type="number" inputmode="decimal" value="${v}" placeholder="-" oninput="bmIn(this,${+p.total||100})" style="width:64px;margin:0;text-align:center"><div id="bg_${p.id}_${x.id}" style="min-height:18px">${v!==""?gchip(gr(+v/(+p.total||100)*100)):""}</div></td>`}).join("")}</tr>`).join("")}</table></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><small id="bmc"></small><div><button class="btn o s" onclick="closeM()">বাতিল</button> <button class="btn s" onclick="bmSave()">💾 সংরক্ষণ করুন</button></div></div>`:`<div class="em">${bmCls?"পরীক্ষা বেছে নিন":"শ্রেণি ও পরীক্ষা নির্বাচন করুন"}</div>`));
 $("mt").onclick=null;bmCount();
}
function bmCount(){const c=$("bmc");if(!c)return;const n=[...document.querySelectorAll("#bmt input")].filter(i=>i.value!=="").length;c.textContent=bn(n)+"টি নম্বর প্রবেশ করানো হয়েছে"}
function bmIn(el,tot){const g=$(el.id.replace("bm_","bg_"));if(g)g.innerHTML=el.value===""?"":gchip(gr(+el.value/tot*100));bmCount()}
function bmSave(){
 bmPapers().forEach(p=>{p.marks=p.marks||{};activeStu(bmCls).forEach(x=>{const el=$("bm_"+p.id+"_"+x.id);if(!el)return;const v=el.value.trim();if(v==="")delete p.marks[x.id];else p.marks[x.id]=Math.min(+v,+p.total||100)})});
 logA("edit","ফলাফল","বাল্ক নম্বর এন্ট্রি: "+bmName+" ("+bmCls+")");save();closeM();render();
}

function shOpen(){shCls=xCls||xClsList()[0]||"";shType=xType||"";shYear=S.school.year||"";cardCtx={kind:"sh"};drawSh()}
function shData(){
 const ps=S.exams.filter(e=>e.cls==shCls&&(!shType||e.type==shType)),subs=[...new Set(ps.map(p=>p.subject))];
 const rows=S.students.filter(s=>s.cls==shCls).map(x=>{const r=stuRes(x,ps),cells=subs.map(n=>{const a=r.rows.filter(q=>q.p.subject==n);return a.length?{v:a.reduce((t,q)=>t+q.g,0),fail:a.some(q=>q.fail)}:null});return {x,r,cells}}).filter(b=>b.r.n).sort((a,b)=>b.r.pc-a.r.pc);
 rows.forEach((b,i)=>b.rank=i+1);
 return {subs,rows,year:shYear};
}

 <table style="width:100%;border-collapse:collapse"><tr><th ${th}>মেধা</th><th ${th}>নাম</th><th ${th}>রোল</th>${d.subs.map(n=>`<th ${th}>${esc(n)}</th>`).join("")}<th ${th}>মোট</th><th ${th}>%</th><th ${th}>গ্রেড</th></tr>${d.rows.map(b=>`<tr><td style="${td};color:${G};font-weight:700">#${bn(b.rank)}</td><td style="${td};text-align:left">${esc(b.x.name)}</td><td style="${td}">${esc(b.x.roll)}</td>${b.cells.map(c=>`<td style="${td};${c&&c.fail?"color:#c62828":""}">${c?bn(c.v):"-"}</td>`).join("")}<td style="${td}"><b>${bn(b.r.T)}/${bn(b.r.F)}</b></td><td style="${td}">${bn(b.r.pc.toFixed(1))}%</td><td style="${td}"><b>${b.r.gr}</b></td></tr>`).join("")||`<tr><td colspan="${d.subs.length+6}" style="${td};padding:16px">কোনো ফলাফল নেই</td></tr>`}</table></div>`;

let EN_RE=null;const trCache=new Map(),BN_RE=/[\u0980-\u09FF]/,NT_SKIP=/^(SCRIPT|STYLE|TEXTAREA|NOSCRIPT)$/,TR_ATTR=["placeholder","title","aria-label","alt"];
const ENN={};
function trS(t){
 if(!BN_RE.test(t))return t;
 let r=trCache.get(t);if(r!==undefined)return r;
 if(!EN_RE){for(const k in EN)ENN[k.normalize("NFC")]=EN[k];const ks=Object.keys(ENN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));EN_RE=new RegExp("(?<![\\u0980-\\u09FF])(?:"+ks.join("|")+")(?![\\u0980-\\u09FF])","g")}
 r=t.normalize("NFC").replace(EN_RE,m=>ENN[m]).replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d));
 if(trCache.size>3000)trCache.clear();trCache.set(t,r);return r}
function trNode(n){
 if(n.nodeType===3){const p=n.parentNode;if(!p||NT_SKIP.test(p.nodeName))return;const v=n.nodeValue;if(!BN_RE.test(v))return;
  if(p.nodeName==="OPTION"&&!p.hasAttribute("value"))p.setAttribute("value",v.replace(/\s+/g," ").trim());
  const t=trS(v);if(t!==v)n.nodeValue=t;return}
 if(n.nodeType!==1||NT_SKIP.test(n.nodeName))return;
 for(const a of TR_ATTR){const v=n.getAttribute(a);if(v&&BN_RE.test(v))n.setAttribute(a,trS(v))}
 for(let c=n.firstChild;c;c=c.nextSibling)trNode(c)}
function trInit(){
 if(LANG!=="en")return;
 document.documentElement.lang="en";document.title=trS(document.title);

 window.alert=m=>_a(trS(String(m)));window.confirm=m=>_c(trS(String(m)));window.prompt=(m,d)=>_p(trS(String(m)),d);
 trNode(document.body);
 new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")trNode(m.target);else m.addedNodes.forEach(trNode)}}).observe(document.body,{childList:true,subtree:true,characterData:true})}
